                          ></span>
                        </div>
                        <div>
                          <p className="text-sm font-bold text-white">
                            @{guest.username} {isMe && <span className="text-[10px] text-nude-300">(Tú)</span>}
                          </p>
                          <p className="text-[11px] text-nude-300">
                            {online ? "🟢 Online" : "🔴 Offline"} • {guestPostsCount} posts
                          </p>
                        </div>
                      </button>

                      <div className="flex items-center gap-1.5">
                        {!isMe && (
                          <>
                            <button
                              onClick={() => handleSendFireMatch(guest)}
                              title="Dar Fuego de Match"
                              className="w-8 h-8 rounded-xl fire-match-btn flex items-center justify-center text-sm font-bold shadow"
                            >
                              🔥
                            </button>
                            <button
                              onClick={() => handleFriendAction(guest)}
                              className={`px-3 py-1.5 rounded-xl text-xs font-extrabold ${
                                relStatus === "friends"
                                  ? "bg-burgundy-950 text-emerald-300 border border-emerald-400/40"
                                  : relStatus === "requested"
                                  ? "bg-burgundy-900 text-amber-200 border border-amber-300/30"
                                  : "nude-btn"
                              }`}
                            >
                              {relStatus === "friends"
                                ? "✓ Amigos"
                                : relStatus === "requested"
                                ? "⏳ Pendiente"
                                : relStatus === "incoming"
                                ? "✓ Aceptar"
                                : "+ Seguir"}
                            </button>
                          </>
                        )}
                        <button
                          onClick={() => openUserProfile(guest.uid)}
                          className="px-2.5 py-1.5 rounded-xl bg-burgundy-800 border border-nude-300/35 text-xs text-white font-bold"
                        >
                          Perfil
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* PESTAÑA 3: CHAT GRUPAL Y CHAT PRIVADO (SOLO AMIGOS)        */}
          {/* ========================================================== */}
          {activeTab === "chat" && !viewedProfileUser && (
            <div className="p-4 space-y-4">
              <div className="grid grid-cols-2 gap-2 bg-burgundy-950 p-1.5 rounded-2xl border border-nude-300/30">
                <button
                  onClick={() => { setChatSubTab("group"); setActiveChatFriend(null); }}
                  className={`py-2.5 rounded-xl text-xs font-extrabold transition ${
                    chatSubTab === "group" ? "nude-btn shadow" : "text-nude-200"
                  }`}
                >
                  🎉 Chat Grupal ({groupMessages.length})
                </button>
                <button
                  onClick={() => setChatSubTab("private")}
                  className={`py-2.5 rounded-xl text-xs font-extrabold transition ${
                    chatSubTab === "private" ? "nude-btn shadow" : "text-nude-200"
                  }`}
                >
                  🥂 Amigos ({myFriendUsers.length})
                </button>
              </div>

              {chatSubTab === "group" && (
                <div className="glass-card rounded-3xl overflow-hidden flex flex-col h-[70vh]">
                  <div className="p-3.5 bg-burgundy-950 border-b border-nude-300/25 flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-bold text-white">🔥 Chat Grupal Sunset Vibes</h3>
                      <p className="text-[10px] text-nude-300">
                        Toca cualquier @usuario para visitar su perfil y darle Match 🔥
                      </p>
                    </div>
                    <span className="text-xs px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-500/40 font-bold">
                      🟢 {users.filter(u => isUserOnline(u)).length} online
                    </span>
                  </div>

                  <div className="flex-1 p-4 overflow-y-auto space-y-3">
                    {groupMessages.length === 0 ? (
                      <p className="text-xs text-center text-nude-200/70 pt-16">
                        ¡Envía el primer mensaje al grupo de la fiesta! 🥂
                      </p>
                    ) : (
                      groupMessages.map((m) => {
                        const isMine = m.senderId === currentUserDoc.uid;
                        const canDelMsg = isMine || isAdmin;
                        const senderObj = users.find(u => u.uid === m.senderId);
                        const online = isUserOnline(senderObj);

                        return (
                          <div key={m.id} className={`flex items-end gap-2 ${isMine ? "justify-end" : "justify-start"}`}>
                            {!isMine && (
                              <button
                                onClick={() => openUserProfile(m.senderId)}
                                className="relative shrink-0"
                              >
                                <img src={senderObj?.avatar || m.senderAvatar} alt="" className="w-8 h-8 rounded-full object-cover border border-nude-300/40" />
                                <span className={`absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border border-burgundy-950 ${online ? "bg-emerald-500" : "bg-red-500"}`}></span>
                              </button>
                            )}

                            <div
                              className={`max-w-[78%] px-3.5 py-2.5 rounded-2xl text-xs relative ${
                                isMine
                                  ? "light-surface font-semibold rounded-br-none"
                                  : "bg-burgundy-900 border border-nude-300/30 text-white rounded-bl-none"
                              }`}
                            >
                              <div className="flex items-center justify-between gap-3 mb-0.5">
                                <button
                                  onClick={() => openUserProfile(m.senderId)}
                                  className={`text-[10px] font-extrabold hover:underline ${
                                    isMine ? "text-[#2E071B]" : "text-nude-300"
                                  }`}
                                >
                                  @{senderObj?.username || m.senderName}
                                </button>
                                {canDelMsg && (
                                  <button
                                    onClick={() => handleDeleteMessage(m)}
                                    className={`text-[10px] font-bold px-1 rounded ${
                                      isMine ? "text-rose-800" : "text-rose-300"
                                    }`}
                                  >
                                    🗑️
                                  </button>
                                )}
                              </div>

                              {m.sharedMediaUrl && (
                                <div
                                  onClick={() => m.sharedPostId && setFullscreenPostId(m.sharedPostId)}
                                  className="mb-2 rounded-xl overflow-hidden bg-black cursor-pointer"
                                >
                                  {m.sharedMediaType === "video" ? (
                                    <video src={m.sharedMediaUrl} controls className="w-full max-h-44 object-contain" />
                                  ) : (
                                    <img src={m.sharedMediaUrl} alt="" className="w-full max-h-44 object-cover" />
                                  )}
                                </div>
                              )}
                              <p>{m.text}</p>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>

                  <form onSubmit={handleSendMessage} className="p-3 bg-burgundy-950 flex gap-2 border-t border-nude-300/20">
                    <input
                      type="text"
                      placeholder="Escribe en el chat grupal..."
                      value={chatText}
                      onChange={(e) => setChatText(e.target.value)}
                      className="flex-1 px-4 py-2.5 rounded-full bg-burgundy-900 border border-nude-300/35 text-xs text-white focus:outline-none"
                    />
                    <button type="submit" className="px-5 py-2.5 rounded-full nude-btn text-xs">
                      Enviar
                    </button>
                  </form>
                </div>
              )}

              {chatSubTab === "private" && (
                activeChatFriend ? (
                  <div className="glass-card rounded-3xl overflow-hidden flex flex-col h-[70vh]">
                    <div className="p-3.5 bg-burgundy-950 border-b border-nude-300/25 flex items-center justify-between">
                      <button
                        onClick={() => openUserProfile(activeChatFriend.uid)}
                        className="flex items-center gap-2.5 text-left group"
                      >
                        <div className="relative">
                          <img src={activeChatFriend.avatar} alt="" className="w-10 h-10 rounded-full object-cover border border-nude-300/40" />
                          <span
                            className={`absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-burgundy-950 ${
                              isUserOnline(activeChatFriend) ? "bg-emerald-500" : "bg-red-500"
                            }`}
                          ></span>
                        </div>
                        <div>
                          <p className="text-sm font-bold text-white group-hover:text-nude-300 underline">
                            @{activeChatFriend.username}
                          </p>
                          <p className="text-[10px] text-nude-300">
                            {isUserOnline(activeChatFriend) ? "🟢 Online • Ver perfil" : "🔴 Offline • Ver perfil"}
                          </p>
                        </div>
                      </button>

                      <button
                        onClick={() => setActiveChatFriend(null)}
                        className="px-3 py-1.5 rounded-full nude-btn text-xs"
                      >
                        ← Mis Amigos
                      </button>
                    </div>

                    <div className="flex-1 p-4 overflow-y-auto space-y-2.5">
                      {privateMessages.length === 0 ? (
                        <p className="text-xs text-center text-nude-200/70 pt-16">
                          Inicia una charla privada con tu amigo @{activeChatFriend.username} 🥂
                        </p>
                      ) : (
                        privateMessages.map((m) => {
                          const isMine = m.senderId === currentUserDoc.uid;
                          const canDelMsg = isMine || isAdmin;
                          return (
                            <div key={m.id} className={`flex ${isMine ? "justify-end" : "justify-start"}`}>
                              <div
                                className={`max-w-[78%] px-3.5 py-2.5 rounded-2xl text-xs ${
                                  isMine
                                    ? "light-surface font-semibold rounded-br-none"
                                    : "bg-burgundy-900 border border-nude-300/30 text-white rounded-bl-none"
                                }`}
                              >
                                <div className="flex items-center justify-between gap-3 mb-0.5">
                                  <button
                                    onClick={() => openUserProfile(m.senderId)}
                                    className={`text-[10px] font-extrabold hover:underline ${
                                      isMine ? "text-[#2E071B]" : "text-nude-300"
                                    }`}
                                  >
                                    @{m.senderName}
                                  </button>
                                  {canDelMsg && (
                                    <button
                                      onClick={() => handleDeleteMessage(m)}
                                      className={`text-[10px] font-bold ${
                                        isMine ? "text-rose-800" : "text-rose-300"
                                      }`}
                                    >
                                      🗑️
                                    </button>
                                  )}
                                </div>

                                {m.sharedMediaUrl && (
                                  <div
                                    onClick={() => m.sharedPostId && setFullscreenPostId(m.sharedPostId)}
                                    className="mb-2 rounded-xl overflow-hidden bg-black cursor-pointer"
                                  >
                                    {m.sharedMediaType === "video" ? (
                                      <video src={m.sharedMediaUrl} controls className="w-full max-h-44 object-contain" />
                                    ) : (
                                      <img src={m.sharedMediaUrl} alt="" className="w-full max-h-44 object-cover" />
                                    )}
                                  </div>
                                )}
                                <p>{m.text}</p>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>

                    <form onSubmit={handleSendMessage} className="p-3 bg-burgundy-950 flex gap-2 border-t border-nude-300/20">
                      <input
                        type="text"
                        placeholder={`Mensaje para @${activeChatFriend.username}...`}
                        value={chatText}
                        onChange={(e) => setChatText(e.target.value)}
                        className="flex-1 px-4 py-2.5 rounded-full bg-burgundy-900 border border-nude-300/35 text-xs text-white focus:outline-none"
                      />
                      <button type="submit" className="px-5 py-2.5 rounded-full nude-btn text-xs">
                        Enviar
                      </button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    {myFriendUsers.length === 0 ? (
                      <div className="glass-card rounded-3xl p-7 text-center space-y-3">
                        <p className="text-3xl">🥂</p>
                        <p className="text-sm font-bold text-white">El Chat Privado es exclusivo para Amigos</p>
                        <p className="text-xs text-nude-200">
                          Envía una solicitud de amistad o acepta un <strong>Fuego de Match 🔥</strong> para habilitar el chat privado con esa persona.
                        </p>
                        <button
                          onClick={() => setActiveTab("search")}
                          className="px-5 py-2.5 rounded-full nude-btn text-xs shadow"
                        >
                          🔍 Buscar Amigos o Dar Match
                        </button>
                      </div>
                    ) : (
                      myFriendUsers.map((friend) => {
                        const online = isUserOnline(friend);
                        return (
                          <div key={friend.uid} className="glass-card rounded-2xl p-3.5 flex items-center justify-between">
                            <button
                              onClick={() => openUserProfile(friend.uid)}
                              className="flex items-center gap-3 text-left"
                            >
                              <div className="relative">
                                <img src={friend.avatar} alt="" className="w-11 h-11 rounded-full object-cover border border-nude-300/50" />
                                <span
                                  className={`absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-burgundy-950 ${
                                    online ? "bg-emerald-500" : "bg-red-500"
                                  }`}
                                ></span>
                              </div>
                              <div>
                                <p className="text-sm font-bold text-white hover:underline">@{friend.username}</p>
                                <p className="text-[10px] text-nude-300">
                                  {online ? "🟢 Online" : "🔴 Offline"} • Amigo Oficial
                                </p>
                              </div>
                            </button>

                            <button
                              onClick={() => setActiveChatFriend(friend)}
                              className="px-4 py-2 rounded-xl nude-btn text-xs shadow"
                            >
                              💬 Chatear
                            </button>
                          </div>
                        );
                      })
                    )}
                  </div>
                )
              )}
            </div>
          )}

          {/* ========================================================== */}
          {/* VISTA DE PERFIL DE OTRO INVITADO (CON FUEGUITO DE MATCH 🔥)*/}
          {/* ========================================================== */}
          {viewedProfileUser && (
            <div className="p-4 space-y-5">
              <button
                onClick={() => setViewedProfileUid(null)}
                className="px-4 py-1.5 rounded-full nude-btn text-xs shadow"
              >
                ← Volver
              </button>

              <div className="glass-card rounded-3xl p-6 text-center relative">
                <div
                  onClick={() => viewedUserStories.length > 0 && openStoriesForUser(viewedProfileUser.uid)}
                  className={`relative inline-block ${viewedUserStories.length > 0 ? "cursor-pointer p-1 rounded-full bg-gradient-to-tr from-amber-400 via-rose-500 to-nude-300" : ""}`}
                >
                  <img
                    src={viewedProfileUser.avatar}
                    alt={viewedProfileUser.username}
                    className="w-24 h-24 rounded-full mx-auto object-cover border-2 border-burgundy-950 shadow-xl"
                  />
                  <span
                    className={`absolute bottom-1 right-1 w-4 h-4 rounded-full border-2 border-burgundy-950 ${
                      isUserOnline(viewedProfileUser) ? "bg-emerald-500" : "bg-red-500"
                    }`}
                  ></span>
                </div>

                <h2 className="font-serif text-2xl font-bold text-white mt-3">@{viewedProfileUser.username}</h2>
                <p className="text-[11px] text-nude-300 font-semibold">
                  {isUserOnline(viewedProfileUser) ? "🟢 En línea en la fiesta" : "🔴 Desconectado"}
                </p>

                <div className="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-nude-300/20">
                  <div>
                    <p className="text-lg font-bold text-white">{viewedUserPosts.length}</p>
                    <p className="text-[10px] uppercase text-nude-300 font-bold">Posts</p>
                  </div>
                  <div>
                    <p className="text-lg font-bold text-white">{viewedUserStories.length}</p>
                    <p className="text-[10px] uppercase text-nude-300 font-bold">Historias</p>
                  </div>
                  <div>
                    <p className="text-lg font-bold text-rose-300">
                      {viewedUserPosts.reduce((s, p) => s + (p.likes?.length || 0), 0)}
                    </p>
                    <p className="text-[10px] uppercase text-nude-300 font-bold">Likes</p>
                  </div>
                </div>

                {/* BOTÓN ESPECIAL DE FUEGO DE MATCH (🔥) EN EL PERFIL DE CADA PERSONA */}
                <button
                  onClick={() => handleSendFireMatch(viewedProfileUser)}
                  className="mt-5 w-full py-3.5 rounded-2xl fire-match-btn font-extrabold text-sm flex items-center justify-center gap-2 shadow-2xl"
                >
                  <span className="text-xl">🔥</span>
                  <span>
                    {(viewedProfileUser.matchesReceived || []).some(m => m.fromUid === currentUserDoc.uid)
                      ? "Fuego de Match Enviado ✨"
                      : "¡Dar Fuego de Match a su Perfil!"}
                  </span>
                </button>

                <div className="grid grid-cols-2 gap-2.5 mt-3">
                  <button
                    onClick={() => handleFriendAction(viewedProfileUser)}
                    className="py-2.5 rounded-xl nude-btn text-xs shadow"
                  >
                    {getRelationshipStatus(viewedProfileUser) === "friends"
                      ? "✓ Son Amigos"
                      : getRelationshipStatus(viewedProfileUser) === "requested"
                      ? "⏳ Solicitud Enviada"
                      : getRelationshipStatus(viewedProfileUser) === "incoming"
                      ? "✓ Aceptar Solicitud"
                      : "+ Solicitar Amistad"}
                  </button>

                  {getRelationshipStatus(viewedProfileUser) === "friends" ? (
                    <button
                      onClick={() => {
                        setViewedProfileUid(null);
                        setActiveTab("chat");
                        setChatSubTab("private");
                        setActiveChatFriend(viewedProfileUser);
                      }}
                      className="py-2.5 rounded-xl bg-burgundy-800 border border-nude-300/40 text-white font-bold text-xs"
                    >
                      💬 Chat Privado
                    </button>
                  ) : (
                    <button
                      onClick={() => alert("Deben ser amigos (o aceptar un Match 🔥) para habilitar el chat privado.")}
                      className="py-2.5 rounded-xl bg-burgundy-950/80 border border-nude-300/20 text-nude-300/60 font-bold text-xs"
                    >
                      🔒 Chat Solo Amigos
                    </button>
                  )}
                </div>
              </div>

              {viewedUserStories.length > 0 && (
                <div className="space-y-2">
                  <h3 className="text-xs font-extrabold uppercase tracking-wider text-nude-300">
                    Historias de @{viewedProfileUser.username} ({viewedUserStories.length})
                  </h3>
                  <div className="stories-oval-bubble rounded-full px-4 py-3 flex items-center gap-3 overflow-x-auto no-scrollbar">
                    {viewedUserStories.map((st, idx) => (
                      <button
                        key={st.id}
                        onClick={() => {
                          const gIdx = storyGroups.findIndex(g => g.userId === viewedProfileUser.uid);
                          if (gIdx !== -1) {
                            setStoryMenuOpen(false);
                            setStoryViewer({ open: true, groupIndex: gIdx, storyIndex: idx, paused: false, progress: 0 });
                          }
                        }}
                        className="shrink-0 relative"
                      >
                        <div className="w-14 h-14 rounded-full p-0.5 bg-gradient-to-tr from-amber-300 via-rose-500 to-nude-200">
                          <img src={st.mediaType === "video" ? viewedProfileUser.avatar : st.mediaUrl} alt="" className="w-full h-full object-cover rounded-full border-2 border-burgundy-950" />
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <div>
                <h3 className="text-xs font-extrabold uppercase tracking-wider text-nude-300 mb-3">
                  Publicaciones de @{viewedProfileUser.username}
                </h3>
                {viewedUserPosts.length === 0 ? (
                  <p className="text-xs text-nude-200/70 glass-card p-6 rounded-2xl text-center">
                    Aún no ha subido publicaciones al muro.
                  </p>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    {viewedUserPosts.map((p) => (
                      <div
                        key={p.id}
                        onClick={() => setFullscreenPostId(p.id)}
                        className="glass-card rounded-2xl overflow-hidden cursor-pointer hover:scale-[1.01] transition"
                      >
                        <div className="h-44 bg-black overflow-hidden">
                          <MediaRenderer item={p} className="w-full h-full object-cover" controls={false} />
                        </div>
                        <div className="p-2.5 flex items-center justify-between text-xs">
                          <span>❤️ {p.likes?.length || 0} • 💬 {p.comments?.length || 0}</span>
                          <span className="text-[10px] text-nude-300 font-bold">Abrir ⤢</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* PESTAÑA 4: MI PERFIL + CARTA CREATIVA DE MATCH + CAJITA 🔥 */}
          {/* ========================================================== */}
          {activeTab === "profile" && !viewedProfileUser && (
            <div className="p-4 space-y-5">

              {/* CARTA SÚPER LINDA Y CREATIVA DE MATCH QUE APARECE AL ENTRAR A TU PERFIL */}
              {pendingMatchCard && (
                <div className="match-card-letter rounded-3xl p-6 text-center space-y-4 relative overflow-hidden">
                  <div className="text-3xl animate-bounce">🔥 💌 🔥</div>
                  <span className="inline-block px-3 py-1 rounded-full bg-amber-300 text-[#090105] font-extrabold text-[10px] uppercase tracking-widest">
                    ¡Carta Secreta de Match en el Sunset!
                  </span>
                  <h3 className="font-serif text-2xl font-bold text-white">
                    ¡Alguien encendió la chispa en tu perfil!
                  </h3>
                  <div className="flex flex-col items-center">
                    <img
                      src={pendingMatchCard.fromAvatar}
                      alt={pendingMatchCard.fromUsername}
                      onClick={() => openUserProfile(pendingMatchCard.fromUid)}
                      className="w-20 h-20 rounded-full object-cover border-2 border-amber-300 shadow-2xl cursor-pointer"
                    />
                    <p className="text-base font-extrabold text-amber-200 mt-2">
                      @{pendingMatchCard.fromUsername}
                    </p>
                  </div>
                  <p className="text-xs text-nude-100 italic max-w-xs mx-auto leading-relaxed">
                    “Entre todas las miradas del atardecer, @{pendingMatchCard.fromUsername} tocó el Fuego de Match en tu perfil. Si aceptas, se volverán amigos automáticamente, recibirán sus alertas y podrán hablar en el chat privado.”
                  </p>

                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <button
                      onClick={() => handleRespondMatchCard(pendingMatchCard, true)}
                      className="py-3 px-4 rounded-2xl fire-match-btn font-extrabold text-xs shadow-xl"
                    >
                      🔥 ¡Aceptar Match y Ser Amigos!
                    </button>
                    <button
                      onClick={() => handleRespondMatchCard(pendingMatchCard, false)}
                      className="py-3 px-4 rounded-2xl bg-burgundy-950/90 border border-nude-300/35 text-nude-200 font-bold text-xs"
                    >
                      Denegar por ahora
                    </button>
                  </div>
                </div>
              )}

              {/* Tarjeta Principal de Mi Perfil */}
              <div className="glass-card rounded-3xl p-6 text-center relative">
                <div
                  onClick={() => myStories.length > 0 && openStoriesForUser(currentUserDoc.uid)}

                  <div className="grid grid-cols-2 gap-3">
                    {myPosts.map((p) => (
                      <div key={p.id} className="glass-card rounded-2xl overflow-hidden">

                        <div className="p-2.5 flex items-center justify-between text-xs">
                          <span>❤️ {p.likes?.length || 0} • 💬 {p.comments?.length || 0}</span>
                          <div className="flex items-center gap-1.5">

                              <button
                                onClick={() => {

                                title="Recortar bordes de la foto"
                                className="px-1.5 py-0.5 rounded bg-nude-300 text-[#090105] font-extrabold text-[10px]"
                              >
                                ✂️
                              </button>
                            )}
                            <button onClick={() => setAdminEditPost({ ...p })} className="text-nude-200">✏️</button>
                            <button onClick={() => handleDeletePost(p)} className="text-rose-300 font-bold">🗑️</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* PESTAÑA 5: PANEL ADMIN (INVITADOS + RETOS POR SECCIONES)   */}
          {/* ========================================================== */}
          {activeTab === "admin" && isAdmin && !viewedProfileUser && (
            <div className="p-4 space-y-4">
              <div className="glass-card rounded-3xl p-5 border border-amber-300/50">
                <span className="text-[10px] uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-amber-300 text-[#090105] font-extrabold">

                </span>
                <h2 className="font-serif text-2xl font-bold text-white mt-2">Panel de Control Total</h2>

                <div className="grid grid-cols-3 gap-2.5 mt-4 text-center">
                  <div className="bg-burgundy-950 p-3 rounded-2xl border border-nude-300/20">
                    <p className="text-xl font-bold text-white">{guestStats.length}</p>
                    <p className="text-[10px] uppercase text-nude-300">Invitados</p>
                  </div>
                  <div className="bg-burgundy-950 p-3 rounded-2xl border border-nude-300/20">
                    <p className="text-xl font-bold text-nude-300">{posts.length + stories.length}</p>
                    <p className="text-[10px] uppercase text-nude-300">Fotos/Stories</p>
                  </div>
                  <div className="bg-burgundy-950 p-3 rounded-2xl border border-nude-300/20">
                    <p className="text-xl font-bold text-amber-300">

                  <button
                    onClick={() => setAdminSubTab("guests")}

                      adminSubTab === "guests" ? "nude-btn" : "text-nude-200"
                    }`}
                  >
                    👥 Invitados ({guestStats.length})
                  </button>
                  <button
                    onClick={() => setAdminSubTab("challenges")}
                    className={`py-2 rounded-xl text-xs font-extrabold ${
                      adminSubTab === "challenges" ? "nude-btn" : "text-nude-200"
                    }`}

                  </button>

              </div>

              {adminSubTab === "guests" && (
                <div className="space-y-2.5">
                  {guestStats.map((g) => (
                    <div key={g.uid} className="glass-card rounded-2xl p-4 space-y-2.5">
                      <div className="flex items-center justify-between">
                        <button
                          onClick={() => openUserProfile(g.uid)}
                          className="flex items-center gap-2.5 text-left"
                        >
                          <img src={g.avatar} alt="" className="w-10 h-10 rounded-full object-cover" />
                          <div>
                            <p className="text-sm font-bold text-white underline">@{g.username}</p>

                          >

                            <button
                              onClick={() => handleAdminDeleteUser(g)}
                              className="px-2.5 py-1 rounded-lg bg-rose-950 text-xs text-rose-200 font-bold"
                            >
                              🗑️ Borrar
                            </button>

                      </div>

                      <div className="grid grid-cols-4 gap-2 pt-2 border-t border-nude-300/15 text-center text-xs">

                          <span className="block font-bold text-white">{g.storiesCount}</span>
                          <span className="text-[10px] text-nude-300">Stories</span>
                        </div>
                        <div>
                          <span className="block font-bold text-rose-300">{g.likesReceived}</span>
                          <span className="text-[10px] text-nude-300">Likes</span>
                        </div>
                        <div>
                          <span className="block font-bold text-amber-300">{g.challengesDone}</span>
                          <span className="text-[10px] text-nude-300">Retos</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {adminSubTab === "challenges" && (
                <div className="space-y-4">
                  {PHOTO_CHALLENGES.map((ch, idx) => {
                    const fullTitle = `${ch.emoji} ${ch.title}`;
                    const chPosts = posts.filter(
                      p => p.challengeId === ch.id || p.challengeTitle === fullTitle

                    return (
                      <div key={ch.id} className="glass-card rounded-3xl p-4 space-y-3 border border-nude-300/30">
                        <div className="flex items-center justify-between">
                          <div>
                            <span className="text-[10px] uppercase tracking-wider text-amber-300 font-extrabold">
                              Sección Reto #{idx + 1}
                            </span>
                            <h4 className="text-sm font-bold text-white">
                              {ch.emoji} {ch.title}
                            </h4>
                          </div>
                          <span className="px-3 py-1 rounded-full nude-btn text-xs">
                            {chPosts.length} subidas
                          </span>
                        </div>

                        {chPosts.length === 0 ? (
                          <p className="text-xs text-nude-300/60 italic py-2">
                            Ningún invitado ha subido fotos o videos para este reto todavía.
                          </p>
                        ) : (
                          <div className="grid grid-cols-2 gap-2.5">
                            {chPosts.map((p) => (
                              <div
                                key={p.id}
                                onClick={() => setFullscreenPostId(p.id)}
                                className="bg-burgundy-950 rounded-2xl overflow-hidden border border-nude-300/20 cursor-pointer"
                              >
                                <div className="h-32 bg-black overflow-hidden">
                                  <MediaRenderer item={p} className="w-full h-full object-cover" controls={false} />
                                </div>
                                <div className="p-2 flex items-center justify-between text-[11px]">
                                  <span className="font-bold text-white truncate">@{p.userName}</span>
                                  <span className="text-rose-300">❤️ {p.likes?.length || 0}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* ========================================================== */}
          {/* MODAL DE LA CAMPANITA DE NOTIFICACIONES (🔔)               */}
          {/* ========================================================== */}
          {notifModalOpen && (

              <div className="glass-card rounded-3xl max-w-md w-full p-5 border border-nude-300/40 space-y-4 max-h-[82vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-nude-300/20 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🔔</span>
                    <h3 className="font-serif text-xl font-bold text-white">Centro de Notificaciones</h3>
                  </div>
                  <button
                    onClick={() => setNotifModalOpen(false)}
                    className="px-3 py-1 rounded-full nude-btn text-xs"
                  >
                    Cerrar ✕
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2.5 no-scrollbar pr-1">
                  {myNotifications.length === 0 ? (
                    <p className="text-xs text-nude-200/70 text-center py-10">
                      Aún no tienes notificaciones. Aquí verás solicitudes de amistad, matches 🔥 y cuando tus amigos suban historias o publicaciones.
                    </p>
                  ) : (
                    myNotifications.map((n) => (
                      <div
                        key={n.id}
                        className="p-3.5 rounded-2xl bg-burgundy-950/90 border border-nude-300/25 space-y-2"
                      >
                        <div className="flex items-center justify-between gap-2">
                          <button
                            onClick={() => openUserProfile(n.fromUid)}
                            className="flex items-center gap-2.5 text-left"

                            <div>
                              <p className="text-xs text-white">
                                <span className="font-extrabold text-nude-300 underline mr-1">
                                  @{n.fromUsername}
                                </span>
                                {n.text}
                              </p>
                            </div>
                          </button>

                          {n.postId && (
                            <button
                              onClick={() => {
                                setNotifModalOpen(false);
                                setFullscreenPostId(n.postId);
                              }}
                              className="px-2.5 py-1 rounded-xl nude-btn text-[10px] shrink-0"
                            >
                              Ver Post
                            </button>
                          )}

                          {n.storyUserId && (
                            <button
                              onClick={() => {
                                setNotifModalOpen(false);
                                openStoriesForUser(n.storyUserId);
                              }}
                              className="px-2.5 py-1 rounded-xl nude-btn text-[10px] shrink-0"
                            >
                              Ver Story
                            </button>
                          )}

                          {n.type === "match_received" && (
                            <button
                              onClick={() => {
                                setNotifModalOpen(false);
                                setViewedProfileUid(null);
                                setActiveTab("profile");
                              }}
                              className="px-2.5 py-1 rounded-xl fire-match-btn text-[10px] font-extrabold shrink-0"
                            >
                              🔥 Ver Carta
                            </button>
                          )}
                        </div>

                        {/* Botones Aceptar / Denegar si es una Solicitud de Amistad pendiente */}
                        {n.type === "friend_request" && n.status === "pending" && (
                          <div className="flex items-center gap-2 pt-1">
                            <button
                              onClick={() => handleRespondFriendRequest(n, true)}
                              className="flex-1 py-2 rounded-xl nude-btn text-xs shadow"
                            >
                              ✓ Aceptar Amistad
                            </button>
                            <button
                              onClick={() => handleRespondFriendRequest(n, false)}
                              className="flex-1 py-2 rounded-xl bg-burgundy-800 border border-nude-300/30 text-xs text-nude-200 font-bold"
                            >
                              ✕ Denegar
                            </button>
                          </div>
                        )}

                        {n.type === "friend_request" && n.status !== "pending" && (
                          <p className="text-[10px] font-bold text-amber-300">
                            {n.status === "accepted" ? "✓ Solicitud aceptada (Son amigos)" : "Solicitud denegada"}
                          </p>
                        )}
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* VISOR DE HISTORIAS PANTALLA COMPLETA (PAUSA REAL + CHAT + ☰)*/}
          {/* ========================================================== */}
          {storyViewer.open && activeStoryGroup && activeStoryItem && (
            <div
              className="fixed inset-0 z-50 bg-black flex flex-col justify-between select-none"
              onTouchStart={(e) => {
                touchStartXRef.current = e.touches[0].clientX;
                wasLongPressRef.current = false;
                longPressTimerRef.current = setTimeout(() => {
                  wasLongPressRef.current = true;
                  setStoryViewer(prev => ({ ...prev, paused: true }));
                }, 200);
              }}
              onTouchEnd={(e) => {
                if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
                if (wasLongPressRef.current) {
                  setStoryViewer(prev => ({ ...prev, paused: false }));
                  return;
                }
                const endX = e.changedTouches[0].clientX;
                const diffX = endX - (touchStartXRef.current || endX);
                if (Math.abs(diffX) > 65) {
                  if (diffX < 0) goNextPersonStories();
                  else goPrevPersonStories();
                }
              }}
            >
              <div className="absolute top-0 left-0 right-0 z-30 p-3 bg-gradient-to-b from-black/85 via-black/40 to-transparent">
                <div className="flex gap-1.5 mb-3">
                  {activeStoryGroup.items.map((st, idx) => {
                    let widthPct = 0;
                    if (idx < storyViewer.storyIndex) widthPct = 100;
                    else if (idx === storyViewer.storyIndex) widthPct = storyViewer.progress;
                    return (
                      <div key={st.id} className="flex-1 h-1 bg-white/30 rounded-full overflow-hidden">
                        <div
                          className="h-full bg-white transition-all duration-75"
                          style={{ width: `${widthPct}%` }}
                        ></div>
                      </div>
                    );
                  })}
                </div>

                <div className="flex items-center justify-between">
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      openUserProfile(activeStoryGroup.userId);
                    }}
                    className="flex items-center gap-2.5 text-left"
                  >
                    <img
                      src={activeStoryGroup.userAvatar}
                      alt=""
                      className="w-9 h-9 rounded-full object-cover border border-white"
                    />
                    <div>
                      <p className="text-sm font-extrabold text-white drop-shadow">
                        @{activeStoryGroup.userName}
                      </p>
                      <p className="text-[10px] text-white/80">
                        {storyViewer.storyIndex + 1} de {activeStoryGroup.items.length} {isStoryEffectivelyPaused && "• ⏸ Pausado"}
                      </p>
                    </div>
                  </button>

                  <div className="flex items-center gap-2" onClick={(e) => e.stopPropagation()}>
                    <button
                      onClick={() => setStoryViewer(prev => ({ ...prev, paused: !prev.paused }))}
                      className="px-3 py-1 rounded-full bg-black/70 border border-white/40 text-white text-xs font-extrabold"
                    >
                      {storyViewer.paused ? "▶ Reanudar" : "⏸ Detener"}
                    </button>

                    {(activeStoryItem.userId === currentUserDoc.uid || isAdmin) && (
                      <button
                        onClick={() => handleDeleteStory(activeStoryItem)}
                        className="px-2.5 py-1 rounded-full bg-rose-600 text-white text-xs font-bold"
                      >
                        🗑️
                      </button>
                    )}

                    <button
                      onClick={() => {
                        setStoryMenuOpen(false);
                        setStoryViewer({ open: false, groupIndex: 0, storyIndex: 0, paused: false, progress: 0 });
                      }}
                      className="w-8 h-8 rounded-full bg-black/70 text-white font-bold text-sm flex items-center justify-center"

          )}

          {/* MODAL EDITAR PUBLICACIÓN */}
          {adminEditPost && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-serif text-xl font-bold text-white">Editar Publicación</h3>
                  <button onClick={() => setAdminEditPost(null)} className="text-nude-300 font-bold">✕</button>
                </div>
                <form onSubmit={handleSavePostEdit} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-nude-200">Pie de foto</label>
                    <input
                      type="text"
                      value={adminEditPost.caption || ""}
                      onChange={(e) => setAdminEditPost({ ...adminEditPost, caption: e.target.value })}
                      className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-xs text-white"
                    />
                  </div>
                  <button type="submit" className="w-full py-3 rounded-xl nude-btn text-xs">
                    Guardar Cambios
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL ADMIN EDITAR USUARIO */}
          {adminEditUser && isAdmin && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-serif text-xl font-bold text-white">Editar Invitado (Admin)</h3>
                  <button onClick={() => setAdminEditUser(null)} className="text-nude-300 font-bold">✕</button>
                </div>
                <form onSubmit={handleAdminSaveUser} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-nude-200">@Usuario</label>
                    <input
                      type="text"
                      value={adminEditUser.username || ""}
                      onChange={(e) => setAdminEditUser({ ...adminEditUser, username: e.target.value })}
                      className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-xs text-white"
                    />
                  </div>
                  <button type="submit" className="w-full py-3 rounded-xl nude-btn text-xs">
                    Actualizar Invitado
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL EDITAR MI PERFIL */}
          {editProfileModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-serif text-xl font-bold text-white">Editar Mi Perfil</h3>
                  <button onClick={() => setEditProfileModal(false)} className="text-nude-300 font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveProfileEdit} className="space-y-3.5">
                  <div className="flex flex-col items-center">
                    <label className="cursor-pointer text-center">
                      <img
                        src={newProfileAvatar || currentUserDoc.avatar}
                        alt=""
                        className="w-24 h-24 rounded-full object-cover mx-auto border-2 border-nude-300"
                      />
                      <span className="mt-2 inline-block text-xs px-3 py-1 rounded-full nude-btn">
                        📷 Cambiar Foto
                      </span>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={async (e) => {
                          const f = e.target.files?.[0];
                          if (f) setNewProfileAvatar(await compressSimpleImage(f));
                        }}
                        className="hidden"
                      />
                    </label>
                  </div>

                  <div>
                    <label className="text-xs text-nude-200 font-bold">Tu @usuario único</label>
                    <input
                      type="text"
                      required
                      value={newProfileUsername}
                      onChange={(e) => setNewProfileUsername(e.target.value)}
                      className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-sm text-white"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-nude-200 font-bold">Nueva contraseña (opcional)</label>
                    <input
                      type="password"
                      placeholder="Dejar vacío para mantener la actual"
                      value={newProfilePassword}
                      onChange={(e) => setNewProfilePassword(e.target.value)}
                      className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-sm text-white"
                    />
                  </div>

                  {profileEditError && <p className="text-xs text-rose-300 font-bold">{profileEditError}</p>}

                  <button type="submit" className="w-full py-3 rounded-xl nude-btn text-xs shadow">
                    Guardar Cambios
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL QR */}
          {qrModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl max-w-sm w-full p-6 text-center border border-nude-300/40 space-y-4">
                <h3 className="font-serif text-2xl font-bold text-white">QR Oficial Sunset Vibes</h3>
                <p className="text-xs text-nude-200">
                  Escanea para entrar al muro, dar Match 🔥 y unirte al Chat Grupal.
                </p>
                <div className="bg-white p-4 rounded-2xl inline-block mx-auto shadow-2xl">
                  <img
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(window.location.href)}`}
                    alt="QR Sunset Vibes"
                    className="w-48 h-48"
                  />
                </div>
                <button onClick={() => setQrModalOpen(false)} className="w-full py-3 rounded-xl nude-btn text-xs">
                  Listo
                </button>
              </div>
            </div>
          )}

          {/* BARRA DE NAVEGACIÓN INFERIOR */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 glass-nav max-w-lg mx-auto px-3 py-2.5 flex items-center justify-around">
            <button
              onClick={() => {
                setViewedProfileUid(null);
                setActiveTab("feed");
                setUnreadStoriesCount(0);
              }}
              className={`relative flex flex-col items-center gap-0.5 text-[11px] font-bold ${
                activeTab === "feed" && !viewedProfileUser ? "text-nude-300" : "text-white/60"
              }`}
            >
              <span className="text-lg">🏠</span>
              <span>Muro</span>
              {unreadStoriesCount > 0 && (
                <span className="absolute -top-1 right-0 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] flex items-center justify-center font-extrabold">
                  {unreadStoriesCount}
                </span>
              )}
            </button>

            <button
              onClick={() => {
                setViewedProfileUid(null);
                setActiveTab("search");
              }}
              className={`flex flex-col items-center gap-0.5 text-[11px] font-bold ${
                activeTab === "search" && !viewedProfileUser ? "text-nude-300" : "text-white/60"
              }`}
            >
              <span className="text-lg">🔍</span>
              <span>Amigos</span>
            </button>

            <button
              onClick={() => {
                resetUploadStudio();
                setUploadModal({ open: true, type: "post", withChallenge: false });
              }}
              className="w-12 h-12 -mt-5 rounded-full nude-btn text-2xl shadow-2xl flex items-center justify-center border-2 border-burgundy-950"
            >
              +
            </button>

            <button
              onClick={() => {
                setViewedProfileUid(null);
                setActiveTab("chat");
                setUnreadChatCount(0);
              }}
              className={`relative flex flex-col items-center gap-0.5 text-[11px] font-bold ${
                activeTab === "chat" && !viewedProfileUser ? "text-nude-300" : "text-white/60"
              }`}
            >
              <span className="text-lg">💬</span>
              <span>Chat</span>
              {unreadChatCount > 0 && (
                <span className="absolute -top-1 right-0 w-4 h-4 rounded-full bg-emerald-500 text-[#090105] text-[9px] flex items-center justify-center font-extrabold">
                  {unreadChatCount}
                </span>
              )}
            </button>

            <button
              onClick={() => {
                setViewedProfileUid(null);
                setActiveTab("profile");
              }}
              className={`relative flex flex-col items-center gap-0.5 text-[11px] font-bold ${
                activeTab === "profile" && !viewedProfileUser ? "text-nude-300" : "text-white/60"
              }`}
            >
              <span className="text-lg">👤</span>
              <span>Perfil</span>
              {pendingMatchCard && (
                <span className="absolute -top-1 right-0 w-4 h-4 rounded-full bg-amber-400 text-[#090105] text-[10px] flex items-center justify-center font-extrabold animate-ping">
                  🔥
                </span>
              )}
            </button>

            {isAdmin && (
              <button
                onClick={() => {
                  setViewedProfileUid(null);
                  setActiveTab("admin");
                }}
                className={`flex flex-col items-center gap-0.5 text-[11px] font-extrabold ${
                  activeTab === "admin" && !viewedProfileUser ? "text-amber-300" : "text-amber-200/70"
                }`}
              >
                <span className="text-lg">👑</span>
                <span>Admin</span>
              </button>
            )}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SunsetVibesApp />);
  </script>
</body>
</html>
