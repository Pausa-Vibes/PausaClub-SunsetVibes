          const srcX = Math.round((leftPct / 100) * img.width);
          const srcY = Math.round((topPct / 100) * img.height);
          const srcW = Math.max(40, Math.round(((100 - leftPct - rightPct) / 100) * img.width));
          const srcH = Math.max(40, Math.round(((100 - topPct - bottomPct) / 100) * img.height));

          let baseW = srcW, baseH = srcH;
          if (baseW > maxDim) { baseH = Math.round((baseH * maxDim) / baseW); baseW = maxDim; }
          if (baseH > maxDim) { baseW = Math.round((baseW * maxDim) / baseH); baseH = maxDim; }

          const isPolaroid = frameId === "polaroid";
          const padSide = isPolaroid ? Math.round(baseW * 0.06) : 0;
          const padTop = isPolaroid ? Math.round(baseW * 0.06) : 0;
          const padBot = isPolaroid ? Math.round(baseW * 0.22) : 0;

          const outW = baseW + padSide * 2;
          const outH = baseH + padTop + padBot;

          const canvas = document.createElement("canvas");
          canvas.width = outW;
          canvas.height = outH;
          const ctx = canvas.getContext("2d");

          if (isPolaroid) {
            ctx.fillStyle = "#FDF4F5";
            ctx.fillRect(0, 0, outW, outH);
          }

          if (filterCss && filterCss !== "none") {
            ctx.filter = filterCss;
          }
          ctx.drawImage(img, srcX, srcY, srcW, srcH, padSide, padTop, baseW, baseH);
          ctx.filter = "none";

          if (isPolaroid) {
            ctx.fillStyle = "#2E071B";
            ctx.font = `700 ${Math.max(22, Math.round(baseW * 0.048))}px "Playfair Display", serif`;
            ctx.textAlign = "center";
            ctx.fillText("🌅 Sunset Vibes • Recuerdo Oficial", outW / 2, baseH + padTop + Math.round(padBot * 0.58));

            ctx.strokeRect(bWidth / 2, bWidth / 2, outW - bWidth, outH - bWidth);
            ctx.fillStyle = "rgba(9, 1, 5, 0.85)";
            ctx.fillRect(0, outH - Math.round(outW * 0.08), outW, Math.round(outW * 0.08));
            ctx.fillStyle = "#FBBF24";
            ctx.font = `800 ${Math.max(18, Math.round(outW * 0.032))}px "Plus Jakarta Sans", sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText("👑 SUNSET VIBES • EDICIÓN VIP 👑", outW / 2, outH - Math.round(outW * 0.03));
          } else if (frameId === "magazine") {
            ctx.strokeStyle = "rgba(255,255,255,0.85)";
            ctx.lineWidth = Math.max(6, Math.round(outW * 0.012));
            const m = Math.round(outW * 0.035);
            ctx.strokeRect(m, m, outW - m * 2, outH - m * 2);
            ctx.fillStyle = "rgba(255,255,255,0.92)";
            ctx.font = `700 ${Math.max(28, Math.round(outW * 0.075))}px "Playfair Display", serif`;
            ctx.textAlign = "center";
            ctx.fillText("SUNSET VIBES", outW / 2, m + Math.round(outW * 0.085));
          } else if (frameId === "cinema") {
            const barH = Math.round(outH * 0.1);
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, outW, barH);
            ctx.fillRect(0, outH - barH, outW, barH);
            ctx.fillStyle = "#FBBF24";
            ctx.font = `600 italic ${Math.max(16, Math.round(outW * 0.028))}px "Plus Jakarta Sans", sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText("“Una noche para recordar siempre” • Sunset Vibes", outW / 2, outH - Math.round(barH * 0.38));
          }

          // Stickers y Sellos con Posición, Escala y Rotación (Sin rebordes amarillos)
          if (Array.isArray(stickers) && stickers.length > 0) {
            stickers.forEach((st) => {
              const sx = padSide + (st.x / 100) * baseW;
              const sy = padTop + (st.y / 100) * baseH;
              const sc = st.scale || 1;
              const rotRad = ((st.rotation || 0) * Math.PI) / 180;

              ctx.save();
              ctx.translate(sx, sy);
              ctx.rotate(rotRad);

              if (st.emoji.length > 4) {
                const stampFont = Math.max(14, Math.round(baseW * 0.031 * sc));
                ctx.font = `800 ${stampFont}px "Plus Jakarta Sans", sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const m = ctx.measureText(st.emoji);
                const bw = m.width + 28 * sc;
                const bh = stampFont + 16 * sc;
                ctx.fillStyle = "rgba(22, 3, 12, 0.88)";
                ctx.beginPath();
                ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 18);
                ctx.fill();
                ctx.strokeStyle = "rgba(232, 180, 184, 0.55)";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = "#FDF4F5";
                ctx.fillText(st.emoji, 0, 0);
              } else {
                const stickerSize = Math.round(baseW * 0.11 * sc);
                ctx.font = `${stickerSize}px sans-serif`;

            ctx.rotate(rotRad);

            ctx.font = `800 ${fontSize}px "Plus Jakarta Sans", sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const textStr = overlayText.trim();
            const metrics = ctx.measureText(textStr);
            const padX = Math.round(baseW * 0.03 * tScale), padY = Math.round(baseW * 0.016 * tScale);
            const boxW = Math.min(baseW - 16, metrics.width + padX * 2);
            const boxH = fontSize + padY * 2;

            ctx.fillStyle = textColorObj?.bg || "rgba(9, 1, 5, 0.82)";
            ctx.beginPath();
            ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 16);
            ctx.fill();

            ctx.fillStyle = textColorObj?.hex || "#FFFFFF";
            ctx.fillText(textStr, 0, 0, baseW - 24);
            ctx.restore();
          }

          resolve(canvas.toDataURL("image/jpeg", quality));

    const compressSimpleImage = (file, maxWidth = 500, quality = 0.84) => {

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (ev) => {
          const img = new Image();
          img.src = ev.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    };

    const validateVideoFile = (file) => {
      return new Promise((resolve, reject) => {
        if (file.size > 100 * 1024 * 1024) {
          reject(new Error("El video es muy pesado. Graba un clip de máximo 15 segundos."));
          return;
        }
        const video = document.createElement("video");
        video.preload = "metadata";
        const objUrl = URL.createObjectURL(file);
        video.onloadedmetadata = () => {
          if (video.duration > 15.8) {
            URL.revokeObjectURL(objUrl);
            reject(new Error(`El video dura ${Math.round(video.duration)} segundos. El máximo permitido es 15s.`));
            return;
          }
          resolve({ previewUrl: objUrl, file, duration: Math.round(video.duration) });
        };
        video.onerror = () => {
          URL.revokeObjectURL(objUrl);
          reject(new Error("Formato de video no compatible."));
        };
        video.src = objUrl;
      });
    };

    // Renderizador Multimedia con Marcos en Videos, Sin Rebordes Amarillos en Stickers y Botón Pantalla Completa
    function MediaRenderer({ item, className = "w-full max-h-[460px] object-contain", onDoubleTapLike, onOpenFullscreen, autoPlay = false, controls = false, paused = false }) {
      const videoRef = useRef(null);
      const [isMuted, setIsMuted] = useState(true);
      const [showHeartBurst, setShowHeartBurst] = useState(false);
      const lastTapRef = useRef(0);

      const filterObj = MEDIA_FILTERS.find(f => f.id === item.filterId) || MEDIA_FILTERS[0];
      const textColorObj = TEXT_COLORS.find(c => c.id === item.overlayColorId) || TEXT_COLORS[0];

      useEffect(() => {
        if (item.mediaType !== "video" || !videoRef.current) return;
        if (paused) {
          videoRef.current.pause();
          return;
        }
        if (autoPlay) {
          videoRef.current.play().catch(() => {});
          return;
        }
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting && !paused) {
                videoRef.current?.play().catch(() => {});
              } else {
                videoRef.current?.pause();
              }
            });
          },
          { threshold: 0.55 }
        );
        observer.observe(videoRef.current);
        return () => observer.disconnect();
      }, [item.mediaUrl, item.mediaType, paused, autoPlay]);

      const handleTap = (e) => {
        const now = Date.now();
        if (now - lastTapRef.current < 320) {
          e.stopPropagation();
          setShowHeartBurst(true);
          if (navigator.vibrate) navigator.vibrate(50);
          if (onDoubleTapLike) onDoubleTapLike();
          setTimeout(() => setShowHeartBurst(false), 850);
        }
        lastTapRef.current = now;
      };

      const bCrop = item.borderCrop || { top: 0, bottom: 0, left: 0, right: 0 };
      const hasVideoBorderCrop = bCrop.top > 0 || bCrop.bottom > 0 || bCrop.left > 0 || bCrop.right > 0;
      const clipPathStyle = hasVideoBorderCrop
        ? `inset(${bCrop.top}% ${bCrop.right}% ${bCrop.bottom}% ${bCrop.left}%)`
        : "none";

      const stickersList = Array.isArray(item.overlayStickers) ? item.overlayStickers : [];

        >
          {item.mediaType === "video" ? (

                </button>
              )}
              {stickersList.map((st) => (
                <span
                  key={st.id}
                  style={{
                    left: `${st.x}%`,
                    top: `${st.y}%`,
                    transform: `translate(-50%, -50%) scale(${st.scale || 1}) rotate(${st.rotation || 0}deg)`
                  }}
                  className={`absolute pointer-events-none drop-shadow-xl z-10 ${
                    st.emoji.length > 4

                      : "text-4xl"
                  }`}
                >
                  {st.emoji}
                </span>
              ))}
              {item.overlayText && (
                <div
                  style={{

                    top: `${tPos.y}%`,
                    transform: `translate(-50%, -50%) scale(${tScale}) rotate(${tRot}deg)`,
                    backgroundColor: textColorObj.bg,

        if ((currentUserDoc.friends || []).includes(targetUser.uid)) return "friends";
        const pendingReq = notifications.find(
          n => n.type === "friend_request" && n.status === "pending" &&
               n.fromUid === currentUserDoc.uid && n.toUid === targetUser.uid
        );
        if (pendingReq) return "requested";
        const incomingReq = notifications.find(
          n => n.type === "friend_request" && n.status === "pending" &&
               n.fromUid === targetUser.uid && n.toUid === currentUserDoc.uid
        );
        if (incomingReq) return "incoming";
        return "none";

        if (!currentUserDoc || !window.FB || !targetUser) return;
        const { db, doc, updateDoc, arrayRemove } = window.FB;
        const status = getRelationshipStatus(targetUser);

        if (status === "friends") {
          if (!confirm(`¿Seguro que deseas eliminar a @${targetUser.username} de tus amigos?`)) return;
          try {
            await updateDoc(doc(db, "users", currentUserDoc.uid), { friends: arrayRemove(targetUser.uid) });
            await updateDoc(doc(db, "users", targetUser.uid), { friends: arrayRemove(currentUserDoc.uid) });
          } catch (e) {}
          return;
        }

        if (status === "requested") {
          alert(`Ya le enviaste una solicitud de amistad a @${targetUser.username}.`);
          return;
        }

        if (status === "incoming") {
          const inc = notifications.find(
            n => n.type === "friend_request" && n.status === "pending" &&
                 n.fromUid === targetUser.uid && n.toUid === currentUserDoc.uid
          );
          if (inc) await handleRespondFriendRequest(inc, true);
          return;
        }

        await sendNotification({
          toUid: targetUser.uid,

      const handleUsernamePasswordAuth = async (e) => {
        e.preventDefault();
        setAuthError("");
        const cleanUser = loginUsername.trim().replace(/^@/, "").replace(/\s+/g, "_");
        const cleanPass = loginPassword.trim();

        if (cleanUser.length < 3 || cleanPass.length < 4) {

          return;
        }

        const matchedUser = users.find(
          u => (u.username || "").toLowerCase() === cleanUser.toLowerCase() ||
               (u.email || "").toLowerCase() === loginUsername.trim().toLowerCase()
        );

        if (authMode === "login") {
          if (!matchedUser) {

            setAuthError("Tu cuenta ha sido bloqueada por el organizador.");

          if (matchedUser.password && matchedUser.password !== cleanPass) {

            return;

          const sessionObj = {

            email: matchedUser.email || `${cleanUser.toLowerCase()}@sunset.local`,

          const uid = "u_" + btoa(cleanUser.toLowerCase() + "_" + Date.now()).replace(/[^a-zA-Z0-9]/g, "").slice(0, 18);

      // ====================================================================

      const resetUploadStudio = () => {
        setRawMediaUrl("");
        setRawVideoFile(null);
        setMediaType("image");
        setVideoDuration(0);
        setActiveStudioTool(null);
        setUploadBorderCrop({ top: 0, bottom: 0, left: 0, right: 0 });
        setSelectedFilter(MEDIA_FILTERS[0]);
        setSelectedFrame(PHOTO_FRAMES[0]);
        setOverlayText("");
        setOverlayColor(TEXT_COLORS[0]);
        setOverlayPos({ x: 50, y: 50 });
        setOverlayScale(1);
        setOverlayRotation(0);
        setDraggingText(false);
        setPlacedStickers([]);
        setSelectedStickerId(null);
        setDraggingStickerId(null);
        setCaption("");
        setMediaError("");
        setUploadProgress(0);
      };

      const addStickerToCanvas = (emoji) => {
        const offset = (placedStickers.length * 8) % 36;
        const newId = "st_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5);
        setPlacedStickers(prev => [
          ...prev,
          { id: newId, emoji, x: 35 + offset, y: 30 + offset, scale: 1, rotation: 0 }
        ]);
        setSelectedStickerId(newId);
      };

      const updateSelectedStickerScale = (delta) => {
        if (!selectedStickerId) return;
        setPlacedStickers(prev =>
          prev.map(st => st.id === selectedStickerId ? { ...st, scale: Math.max(0.4, Math.min(2.6, Math.round(((st.scale || 1) + delta) * 10) / 10)) } : st)
        );
      };

      const updateSelectedStickerRotation = (degDelta) => {
        if (!selectedStickerId) return;
        setPlacedStickers(prev =>
          prev.map(st => st.id === selectedStickerId ? { ...st, rotation: ((st.rotation || 0) + degDelta) % 360 } : st)
        );
      };

      const removeStickerFromCanvas = (id) => {
        setPlacedStickers(prev => prev.filter(s => s.id !== id));
        if (selectedStickerId === id) setSelectedStickerId(null);
      };

      // Mover tanto Stickers como Texto en X e Y libremente con el dedo
      const handleCanvasPointerMove = (clientX, clientY) => {
        if (!previewBoxRef.current) return;
        const rect = previewBoxRef.current.getBoundingClientRect();
        const xPct = Math.max(6, Math.min(94, ((clientX - rect.left) / rect.width) * 100));
        const yPct = Math.max(8, Math.min(92, ((clientY - rect.top) / rect.height) * 100));

        if (draggingStickerId) {
          setPlacedStickers(prev =>
            prev.map(st => st.id === draggingStickerId ? { ...st, x: Math.round(xPct * 10) / 10, y: Math.round(yPct * 10) / 10 } : st)
          );
        } else if (draggingText) {
          setOverlayPos({ x: Math.round(xPct), y: Math.round(yPct) });
        }
      };

      const handleMediaFileChange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setMediaError("");

        if (file.type.startsWith("video/")) {
          try {
            const { previewUrl, duration } = await validateVideoFile(file);
            setMediaType("video");
            setVideoDuration(duration);
            setRawVideoFile(file);
            setRawMediaUrl(previewUrl);
          } catch (err) {
            setMediaError(err.message);
            setRawMediaUrl("");
            setRawVideoFile(null);
          }
        } else {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (ev) => {
            setMediaType("image");
            setVideoDuration(0);
            setRawVideoFile(null);
            setRawMediaUrl(ev.target.result);
          };
        }
      };

      // Publicar Multimedia: En fotos sube tanto la versión original sin recortar (para poder re-recortar después sin corromper) como la versión horneada final
      const handlePublishEditedMedia = async (e) => {
        e.preventDefault();
        if (!rawMediaUrl || !currentUserDoc || isSubmitting) return;
        setIsSubmitting(true);
        setUploadProgress(5);
        setMediaError("");
        const { db, collection, addDoc } = window.FB;

        try {
          let finalCloudUrl = "";
          let uncroppedCloudUrl = "";

          if (mediaType === "image") {
            const hdBakedDataUrl = await bakeEditedImage(rawMediaUrl, {
              filterCss: selectedFilter.css,
              borderCrop: uploadBorderCrop,
              frameId: selectedFrame.id,
              overlayText,
              textColorObj: overlayColor,
              textPos: overlayPos,
              textScale: overlayScale,
              textRotation: overlayRotation,
              stickers: placedStickers,
              maxDim: 1600,
              quality: 0.88
            });

            try {
              finalCloudUrl = await uploadMediaFile(hdBakedDataUrl, "image", (pct) => setUploadProgress(pct));
              // Si tenía recorte aplicado, guardamos también la versión sin recorte por si quiere re-recortar más tarde
              const hasCrop = uploadBorderCrop.top > 0 || uploadBorderCrop.bottom > 0 || uploadBorderCrop.left > 0 || uploadBorderCrop.right > 0;
              if (hasCrop) {
                const uncroppedBaked = await bakeEditedImage(rawMediaUrl, {
                  filterCss: selectedFilter.css,
                  borderCrop: { top: 0, bottom: 0, left: 0, right: 0 },
                  frameId: selectedFrame.id,
                  overlayText,
                  textColorObj: overlayColor,
                  textPos: overlayPos,
                  textScale: overlayScale,
                  textRotation: overlayRotation,
                  stickers: placedStickers,
                  maxDim: 1600,
                  quality: 0.86
                });
                uncroppedCloudUrl = await uploadMediaFile(uncroppedBaked, "image").catch(() => finalCloudUrl);
              } else {
                uncroppedCloudUrl = finalCloudUrl;
              }
            } catch (cloudErr) {
              finalCloudUrl = await bakeEditedImage(rawMediaUrl, {
                filterCss: selectedFilter.css,
                borderCrop: uploadBorderCrop,
                frameId: selectedFrame.id,
                overlayText,
                textColorObj: overlayColor,
                textPos: overlayPos,
                textScale: overlayScale,
                textRotation: overlayRotation,
                stickers: placedStickers,
                maxDim: 820,
                quality: 0.74
              });
              uncroppedCloudUrl = finalCloudUrl;
            }
          } else {
            const videoSource = rawVideoFile || rawMediaUrl;

            uncroppedCloudUrl = finalCloudUrl;
          }

          const basePayload = {

            userName: currentUserDoc.username,
            userAvatar: currentUserDoc.avatar,
            mediaUrl: finalCloudUrl,
            originalMediaUrl: uncroppedCloudUrl || finalCloudUrl,

            filterId: mediaType === "video" ? selectedFilter.id : "normal",
            frameId: mediaType === "video" ? selectedFrame.id : "none",

            overlayText: mediaType === "video" ? overlayText.trim() : "",
            overlayColorId: overlayColor.id,
            overlayPos: overlayPos,
            overlayYPos: overlayPos.y,
            overlayScale: overlayScale,
            overlayRotation: overlayRotation,
            overlayStickers: mediaType === "video" ? placedStickers : [],

          };

          const myFriendsList = currentUserDoc.friends || [];

          if (uploadModal.type === "story") {

              challengeTitle: chTitle,

            if (uploadModal.isPaparazzi && paparazziTarget) {

          setUploadProgress(0);

      // Recorte No-Destructivo de Publicaciones Ya Subidas (Parte siempre de originalMediaUrl y permite guardarlo o descargarlo)
      const handleApplyBorderCrop = async (alsoDownload = false) => {
        if (!cropModalPost || isCroppingPost || !window.FB) return;

        try {
          const sourceUrl = cropModalPost.originalMediaUrl || cropModalPost.mediaUrl;

      const toggleLike = async (post) => {

        const hasLiked = (post.likes || []).includes(currentUserDoc.uid);
        try {

            likes: hasLiked ? arrayRemove(currentUserDoc.uid) : arrayUnion(currentUserDoc.uid)
          });

            });

        } catch (e) {}
      };

      const toggleReaction = async (post, emoji) => {
        if (!currentUserDoc || !window.FB) return;
        const currentReactions = post.reactions ? { ...post.reactions } : {};
        const usersForEmoji = Array.isArray(currentReactions[emoji]) ? [...currentReactions[emoji]] : [];
        const idx = usersForEmoji.indexOf(currentUserDoc.uid);

        if (idx > -1) usersForEmoji.splice(idx, 1);
        else usersForEmoji.push(currentUserDoc.uid);
        currentReactions[emoji] = usersForEmoji;

        try {
          await window.FB.updateDoc(window.FB.doc(window.FB.db, "posts", post.id), {
            reactions: currentReactions
          });
          if (idx === -1 && post.userId !== currentUserDoc.uid) {
            sendNotification({
              toUid: post.userId,

              text: `reaccionó con ${emoji} a tu foto.`,
              postId: post.id
            });
          }
        } catch (e) {}
      };

      const handleAddComment = async (postId) => {
        const text = (commentInputs[postId] || "").trim();
        if (!text || !currentUserDoc || !window.FB) return;
        const { db, doc, updateDoc, arrayUnion } = window.FB;
        const targetPost = posts.find(p => p.id === postId);
        const newComment = {
          id: "c_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          userId: currentUserDoc.uid,
          userName: currentUserDoc.username,
          userAvatar: currentUserDoc.avatar,
          text,
          createdAt: Date.now()
        };
        try {
          await updateDoc(doc(db, "posts", postId), { comments: arrayUnion(newComment) });

          notifyMentionedUsers(text, "un comentario", postId);

              toUid: targetPost.userId,
              type: "comment",
              text: `💬 comentó en tu publicación: "${text.slice(0, 35)}"`,

            });

        } catch (e) {}
      };

      const handleDeleteComment = async (post, commentObj) => {
        if (!currentUserDoc || !window.FB) return;
        if (commentObj.userId !== currentUserDoc.uid && post.userId !== currentUserDoc.uid && !isAdmin) return;
        const updated = (post.comments || []).filter(c => c.id !== commentObj.id);
        try {
          await window.FB.updateDoc(window.FB.doc(window.FB.db, "posts", post.id), { comments: updated });
        } catch (e) {}
      };

      const handleDeletePost = async (post) => {
        if (!currentUserDoc || !window.FB) return;
        if (post.userId !== currentUserDoc.uid && !isAdmin) return;
        if (!confirm("¿Eliminar esta publicación permanentemente?")) return;
        try {
          await window.FB.deleteDoc(window.FB.doc(window.FB.db, "posts", post.id));
          if (fullscreenPostId === post.id) setFullscreenPostId(null);
        } catch (e) {}
      };

      const handleDeleteStory = async (story) => {

        if (story.userId !== currentUserDoc.uid && !isAdmin) return;
        if (!confirm("¿Eliminar esta historia?")) return;
        try {
          await window.FB.deleteDoc(window.FB.doc(window.FB.db, "stories", story.id));

          await window.FB.updateDoc(window.FB.doc(window.FB.db, "users", adminEditUser.uid), updateData);

      // BORRADO EN CASCADA TOTAL + BLOQUEO OPCIONAL DE DISPOSITIVO
      const handleAdminDeleteUser = async (targetUser, alsoBanDevice = true) => {
        if (!isAdmin || !window.FB) return;
        if (!confirm(`⚠️ ¿Eliminar por completo a @${targetUser.username} y bloquear su dispositivo? Se borrarán su perfil, fotos, historias, chats, notificaciones, likes y comentarios.`)) return;
        const { db, chatDb, doc, deleteDoc, updateDoc, arrayRemove } = window.FB;
        const tUid = targetUser.uid;

        try {
          if (alsoBanDevice) {
            const bannedDevs = Array.isArray(partyState?.bannedDevices) ? [...partyState.bannedDevices] : [];
            const bannedUids = Array.isArray(partyState?.bannedUids) ? [...partyState.bannedUids] : [];
            if (!bannedUids.includes(tUid)) bannedUids.push(tUid);
            if (targetUser.deviceId && !bannedDevs.includes(targetUser.deviceId)) {
              bannedDevs.push(targetUser.deviceId);
            }
            await saveGlobalPartyState({ bannedDevices: bannedDevs, bannedUids });
          }

          await deleteDoc(doc(db, "users", tUid));

          posts.forEach(p => {
            if (p.userId === tUid) {
              deleteDoc(doc(db, "posts", p.id)).catch(() => {});
            } else {
              const hasLike = (p.likes || []).includes(tUid);
              const hasComm = (p.comments || []).some(c => c.userId === tUid);
              if (hasLike || hasComm) {
                const newLikes = (p.likes || []).filter(id => id !== tUid);
                const newComms = (p.comments || []).filter(c => c.userId !== tUid);
                updateDoc(doc(db, "posts", p.id), { likes: newLikes, comments: newComms }).catch(() => {});
              }
            }
          });

          stories.filter(s => s.userId === tUid).forEach(s => {
            deleteDoc(doc(db, "stories", s.id)).catch(() => {});
          });

          messages.filter(m => m.senderId === tUid || m.receiverId === tUid).forEach(m => {
            deleteDoc(doc(chatDb, "messages", m.id)).catch(() => {});
          });

          [...notifications, ...djSongs, ...confessions, ...destinyLetters]
            .filter(n => n.fromUid === tUid || n.toUid === tUid)
            .forEach(n => {
              deleteDoc(doc(chatDb, "notifications", n.id)).catch(() => {});
            });

          users.forEach(u => {
            if (u.uid !== tUid) {
              const inFriends = (u.friends || []).includes(tUid);
              const inMatches = (u.matchesReceived || []).some(m => m.fromUid === tUid);
              if (inFriends || inMatches) {
                updateDoc(doc(db, "users", u.uid), {
                  friends: arrayRemove(tUid),
                  matchesReceived: (u.matchesReceived || []).filter(m => m.fromUid !== tUid)
                }).catch(() => {});
              }
            }
          });

          if (viewedProfileUid === tUid) setViewedProfileUid(null);
          setInAppToast({
            id: Date.now(),
            icon: "🚫",
            title: `@${targetUser.username} eliminado y bloqueado`,
            text: "Sus registros fueron borrados y su celular bloqueado.",
            action: () => setInAppToast(null)
          });
        } catch (e) {}
      };

      // Mantener apretado un mensaje en el chat para responder (Long Press)
      const startMessageLongPress = (msg) => {
        if (msgLongPressTimerRef.current) clearTimeout(msgLongPressTimerRef.current);
        msgLongPressTimerRef.current = setTimeout(() => {
          if (navigator.vibrate) navigator.vibrate(65);
          setReplyingToMsg(msg);
        }, 430);
      };

      const cancelMessageLongPress = () => {
        if (msgLongPressTimerRef.current) {
          clearTimeout(msgLongPressTimerRef.current);

      const handleSendMessage = async (e, customImgUrl = null) => {

        const isGroup = chatSubTab === "group" || !activeChatFriend;
        const chatKey = isGroup
          ? "GLOBAL_GROUP"
          : [currentUserDoc.uid, activeChatFriend.uid].sort().join("__");

        try {
          await addDoc(collection(chatDb, "messages"), {
            chatKey,
            senderId: currentUserDoc.uid,
            senderName: currentUserDoc.username,
            senderAvatar: currentUserDoc.avatar,
            receiverId: isGroup ? "ALL" : activeChatFriend.uid,
            text: textVal || "📷 Foto en el chat",

        try {

            senderId: currentUserDoc.uid,
            senderName: currentUserDoc.username,
            senderAvatar: currentUserDoc.avatar,
            receiverId: targetType === "group" ? "ALL" : targetFriend.uid,

            createdAt: Date.now()

      const handleExternalShare = async (item) => {

        };

          try { await navigator.share(shareData); } catch (e) {}
        } else {
          navigator.clipboard?.writeText(window.location.href);
          alert("¡Enlace copiado al portapapeles!");

      };

      const handleSaveProfileEdit = async (e) => {
        e.preventDefault();
        setProfileEditError("");

        const cleanU = (newProfileUsername || currentUserDoc.username).trim().replace(/^@/, "").replace(/\s+/g, "_");

          setProfileEditError("El nombre de usuario debe tener al menos 3 caracteres.");

        if (users.some(u => u.uid !== currentUserDoc.uid && (u.username || "").toLowerCase() === cleanU.toLowerCase())) {
          setProfileEditError(`El usuario @${cleanU} ya está ocupado.`);
          return;

        const updatePayload = {
          username: cleanU,
          name: cleanU,
          avatar: finalAvatarUrl,
          vibeStatus: newProfileVibe || currentUserDoc.vibeStatus || "🥂 En la barra",
          lastSeen: Date.now()
        };
        if (newProfilePassword.trim().length >= 4) {
          updatePayload.password = newProfilePassword.trim();
        }

        try {
          await window.FB.updateDoc(window.FB.doc(window.FB.db, "users", currentUserDoc.uid), updatePayload);
          setEditProfileModal(false);
          setInAppToast({
            id: Date.now(),
            icon: "✅",
            title: "Perfil y Vibe actualizados",
            text: `@${cleanU} • ${updatePayload.vibeStatus}`,
            action: () => setInAppToast(null)
          });
        } catch (e) {
          setProfileEditError("Error al guardar cambios.");
        }
      };

      const handleQuickVibeUpdate = async (vibeStr) => {
        if (!currentUserDoc || !window.FB) return;
        try {
          await window.FB.updateDoc(window.FB.doc(window.FB.db, "users", currentUserDoc.uid), {
            vibeStatus: vibeStr
          });
        } catch (e) {}
      };

      const myPosts = posts.filter(p => p.userId === currentUserDoc?.uid);
      const myStories = stories.filter(s => s.userId === currentUserDoc?.uid);
      const myTotalLikes = myPosts.reduce((s, p) => s + (p.likes?.length || 0), 0);

      const myFriendUsers = useMemo(() => {
        if (!currentUserDoc) return [];
        const friendIds = currentUserDoc.friends || [];
        return users.filter(u => u.uid !== currentUserDoc.uid && u.username && friendIds.includes(u.uid));
      }, [users, currentUserDoc]);

      const sortedAndFilteredPosts = useMemo(() => {
        let result = [...posts];
        if (feedFilter === "trending") {
          result.sort((a, b) => ((b.likes?.length || 0) + Object.keys(b.reactions || {}).length) - ((a.likes?.length || 0) + Object.keys(a.reactions || {}).length));
        } else if (feedFilter === "friends" && currentUserDoc) {
          const allowedUids = [...(currentUserDoc.friends || []), currentUserDoc.uid];
          result = result.filter(p => allowedUids.includes(p.userId));
        } else if (feedFilter === "challenge" && selectedChallengeFilter) {
          result = result.filter(p => p.challengeId === selectedChallengeFilter.id || p.challengeTitle?.includes(selectedChallengeFilter.title));
        }
        return result;
      }, [posts, feedFilter, selectedChallengeFilter, currentUserDoc]);

      const guestStats = useMemo(() => {
        return users.filter(u => u.username).map(u => {
          const uPosts = posts.filter(p => p.userId === u.uid);
          const uStories = stories.filter(s => s.userId === u.uid);
          return {
            ...u,
            postsCount: uPosts.length,
            storiesCount: uStories.length,
            likesReceived: uPosts.reduce((s, p) => s + (p.likes?.length || 0), 0),
            challengesDone: uPosts.filter(p => !!p.challengeTitle).length
          };
        });
      }, [users, posts, stories]);

      const filteredSearchUsers = useMemo(() => {
        const q = searchQuery.trim().replace(/^@/, "").toLowerCase();
        return users.filter(u => u.username).filter(u => !q || u.username.toLowerCase().includes(q));
      }, [users, searchQuery]);
      // ====================================================================
      // RENDERIZADO VISUAL COMPLETO Y DEFINITIVO
      // ====================================================================

      // Pantalla de Bloqueo Permanente si el Admin expulsó el dispositivo o la cuenta
      if (isCurrentDeviceBlocked) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6 text-center">
            <div className="glass-card rounded-3xl max-w-md w-full p-8 border-2 border-rose-500/80 space-y-5 shadow-2xl">
              <div className="w-20 h-20 rounded-full bg-rose-950 border-2 border-rose-500 mx-auto flex items-center justify-center text-3xl">
                🚫
              </div>
              <h1 className="font-serif text-2xl font-bold text-white">Acceso Restringido</h1>
              <p className="text-xs text-nude-200 leading-relaxed">
                El organizador ha bloqueado el acceso a la aplicación desde este dispositivo. No es posible volver a ingresar ni crear cuentas nuevas en este equipo.
              </p>
              <div className="pt-2">
                <span className="text-[10px] text-nude-300 font-mono">Sunset Vibes • Seguridad Activa</span>
              </div>
            </div>
          </div>
        );
      }

      if (!authSession) {
        return (
          <div className="min-h-screen flex flex-col justify-between items-center p-5 relative overflow-hidden">
            <div className="w-full max-w-md z-10 my-auto">
              <div className="glass-card rounded-3xl p-7 text-center border border-nude-300/40">
                <div className="mx-auto mb-3 flex items-center justify-center">
                  <BrandLogo size="lg" />
                </div>

                <h1 className="font-serif text-3xl font-bold text-white">Sunset Vibes</h1>
                <p className="text-[11px] uppercase tracking-[0.22em] text-nude-300 font-bold mb-4">La Red Social Oficial del Evento</p>

                <div className="min-h-[46px] flex items-center justify-center px-3 py-1.5 mb-5 rounded-2xl bg-burgundy-950/90 border border-nude-300/20">
                  <p className="text-xs italic text-nude-100">{INSPIRATIONAL_QUOTES[quoteIndex]}</p>

                  onClick={handleGoogleSignIn}
                  className="w-full py-3.5 px-5 rounded-2xl bg-white text-[#090105] font-extrabold text-sm flex items-center justify-center gap-3 shadow-xl hover:bg-nude-100 transition"
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
                    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
                    <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"/>
                    <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5L1.6 17c1.9 3.9 5.8 7 10.4 7z"/>
                  </svg>
                  Continuar con Google
                </button>

                <div className="my-4 flex items-center gap-3">
                  <div className="h-px flex-1 bg-nude-300/25"></div>
                  <span className="text-[10px] uppercase tracking-wider text-nude-300 font-bold">O con usuario y contraseña</span>

                  <button type="button" onClick={() => { setAuthMode("login"); setAuthError(""); }} className={`py-2 rounded-lg text-xs font-extrabold transition ${authMode === "login" ? "nude-btn" : "text-nude-200"}`}>Iniciar Sesión</button>

                </div>

                <form onSubmit={handleUsernamePasswordAuth} className="space-y-3 text-left">

                      <label className="cursor-pointer text-center">
                        <img src={setupAvatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(loginUsername || "sunset")}`} alt="" className="w-16 h-16 rounded-full object-cover mx-auto border-2 border-nude-300" />
                        <span className="mt-1.5 inline-block text-[11px] px-3 py-0.5 rounded-full nude-btn">📷 Elegir foto de perfil</span>
                        <input type="file" accept="image/*" onChange={async (e) => { const f = e.target.files?.[0]; if (f) setSetupAvatar(await compressSimpleImage(f)); }} className="hidden" />

                      <input type="text" required placeholder="Nombre de usuario" value={loginUsername} onChange={(e) => setLoginUsername(e.target.value)} className="w-full pl-8 pr-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-white text-sm focus:outline-none" />

                  </div>

      if (!currentUserDoc) {

              <form onSubmit={handleCompleteGoogleProfile} className="space-y-4 text-left">
                <div className="flex flex-col items-center">

                    <img src={setupAvatar || authSession.defaultAvatar} alt="" className="w-24 h-24 rounded-full object-cover border-2 border-nude-300 mx-auto" />
                    <span className="mt-2 inline-block text-xs px-3 py-1 rounded-full nude-btn">📷 Cambiar Foto</span>

                <div>
                  <label className="text-xs font-bold text-nude-200 ml-1">Nombre de usuario</label>

                    <input type="text" required placeholder="Nombre de usuario" value={setupUsername} onChange={(e) => setSetupUsername(e.target.value)} className="w-full pl-8 pr-4 py-3 rounded-xl bg-burgundy-950 border border-nude-300/40 text-white text-sm focus:outline-none" />

              </form>

        );
      }

      const groupMessages = messages.filter(m => m.chatKey === "GLOBAL_GROUP");
      const activePrivateChatKey = activeChatFriend ? [currentUserDoc.uid, activeChatFriend.uid].sort().join("__") : null;
      const privateMessages = messages.filter(m => m.chatKey === activePrivateChatKey);

      const viewedProfileUser = viewedProfileUid ? users.find(u => u.uid === viewedProfileUid) : null;
      const viewedUserPosts = viewedProfileUser ? posts.filter(p => p.userId === viewedProfileUser.uid) : [];
      const viewedUserStories = viewedProfileUser ? stories.filter(s => s.userId === viewedProfileUser.uid) : [];
      const fullscreenPost = fullscreenPostId ? posts.find(p => p.id === fullscreenPostId) : null;
      const activeStoryGroup = storyViewer.open ? storyGroups[storyViewer.groupIndex] : null;
      const activeStoryItem = activeStoryGroup ? activeStoryGroup.items[storyViewer.storyIndex] : null;

      return (
        <div className="min-h-screen pb-24 max-w-lg mx-auto relative select-none">

          {/* NOTIFICACIÓN FLOTANTE */}
          {inAppToast && (
            <div onClick={inAppToast.action} className="fixed top-4 left-1/2 z-50 w-[92%] max-w-md cursor-pointer toast-enter light-surface rounded-2xl p-3.5 shadow-2xl border-2 border-burgundy-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-2xl">{inAppToast.icon}</span>
                <div>
                  <p className="text-xs font-extrabold text-[#090105]">{inAppToast.title}</p>
                  <p className="text-xs text-[#2E071B] truncate max-w-[230px] font-semibold">{inAppToast.text}</p>
                </div>
              </div>
              <span className="text-[11px] font-extrabold px-2.5 py-1 rounded-full bg-burgundy-900 text-white">Abrir</span>
            </div>
          )}

          {/* MODAL RULETA EN VIVO EN LAS 100 PANTALLAS (#4) */}
          {wheelModalState.open && (
            <div className="fixed inset-0 z-50 bg-black/92 backdrop-blur-md flex items-center justify-center p-4">
              <div className="match-card-letter rounded-3xl max-w-md w-full p-7 text-center space-y-5 border-2 border-amber-300 shadow-2xl">
                <span className="px-3 py-1 rounded-full bg-amber-300 text-[#090105] font-extrabold text-[10px] uppercase tracking-widest animate-bounce">
                  🎰 ¡Ruleta de Regalos del Admin en Vivo!
                </span>
                <h3 className="font-serif text-2xl font-bold text-white">
                  Premio: {wheelModalState.spinData?.prize || "Premio Sorpresa"}
                </h3>

                {wheelModalState.spinning ? (
                  <div className="py-6 space-y-3">
                    <div className="w-24 h-24 rounded-full mx-auto p-1 bg-gradient-to-tr from-amber-400 to-rose-500 animate-spin">
                      <img
                        src={wheelModalState.spinData?.candidates?.[wheelModalState.displayIndex]?.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed=spin"}
                        alt=""
                        className="w-full h-full rounded-full object-cover border-2 border-burgundy-950 bg-burgundy-950"
                      />
                    </div>
                    <p className="text-sm font-bold text-amber-200 animate-pulse">Girando la ruleta en las 100 pantallas...</p>
                  </div>
                ) : (
                  <div className="py-4 space-y-4">
                    <div className="w-28 h-28 rounded-full mx-auto p-1 bg-gradient-to-tr from-amber-300 via-rose-500 to-amber-300 shadow-2xl">
                      <img
                        src={wheelModalState.spinData?.winnerAvatar}
                        alt=""
                        className="w-full h-full rounded-full object-cover border-2 border-burgundy-950"
                      />
                    </div>
                    <div>
                      <p className="text-xs text-nude-200 uppercase font-bold">¡El ganadora o ganador es!</p>
                      <h2 className="text-2xl font-extrabold text-amber-300 mt-1">
                        @{wheelModalState.spinData?.winnerUsername} 👑
                      </h2>
                    </div>
                    <p className="text-xs text-nude-100 italic">
                      ¡Acércate al organizador o a la barra para reclamar tu premio!
                    </p>
                    <button
                      onClick={() => setWheelModalState(prev => ({ ...prev, open: false }))}
                      className="w-full py-3.5 rounded-2xl fire-match-btn font-extrabold text-xs shadow-xl"
                    >
                      ¡Felicidades! 🎉 Cerrar
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL RESUMEN PERSONAL SUNSET WRAPPED (#2) */}
          {wrappedModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/92 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-card rounded-3xl max-w-md w-full p-6 text-center space-y-4 my-auto border-2 border-nude-300">
                <div className="flex items-center justify-between">
                  <h3 className="font-serif text-xl font-bold text-white">✨ Tu Resumen Sunset Wrapped</h3>
                  <button onClick={() => setWrappedModalOpen(false)} className="text-nude-300 font-bold">✕</button>
                </div>

                {isGeneratingWrapped ? (
                  <div className="py-16 space-y-3">
                    <div className="w-12 h-12 rounded-full border-4 border-amber-300 border-t-transparent animate-spin mx-auto"></div>
                    <p className="text-xs font-bold text-nude-200 animate-pulse">Generando tu tarjeta de recuerdo...</p>
                  </div>
                ) : wrappedDataUrl ? (
                  <div className="space-y-4">
                    <div className="rounded-2xl overflow-hidden border border-nude-300/40 max-h-[60vh] flex items-center justify-center bg-black">
                      <img src={wrappedDataUrl} alt="Sunset Wrapped" className="w-full max-h-[60vh] object-contain" />
                    </div>
                    <button onClick={handleDownloadMyWrapped} className="w-full py-3.5 rounded-2xl nude-btn font-extrabold text-xs shadow-xl">
                      💾 Descargar Tarjeta Wrapped (.JPG)
                    </button>
                  </div>
                ) : (
                  <p className="text-xs text-rose-300">No se pudo generar el resumen.</p>
                )}
              </div>
            </div>
          )}

          {/* BARRA SUPERIOR CON LOGO, CAMPANITA (🔔), AUDIO (🔊) Y QR */}
          <header className="sticky top-0 z-30 glass-nav px-4 py-3 flex items-center justify-between border-b border-nude-300/25">
            <div onClick={() => { setViewedProfileUid(null); setActiveTab("feed"); }} className="flex items-center gap-2.5 cursor-pointer">
              <BrandLogo size="md" />
              <div>
                <h1 className="font-serif text-lg font-bold leading-none text-white">Sunset Vibes</h1>
                <div className="flex items-center gap-1.5 mt-0.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-[10px] text-nude-300 font-bold tracking-wider">
                    @{currentUserDoc.username} {isAdmin && "👑"}
                  </span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={requestSystemNotificationPerm}
                className="w-8 h-8 rounded-full bg-burgundy-900 border border-nude-300/30 flex items-center justify-center text-xs"
                title="Activar alertas con sonido"
              >
                🔊
              </button>

              <button
                onClick={handleOpenBellModal}
                className="relative w-9 h-9 rounded-full bg-burgundy-800 border border-nude-300/40 flex items-center justify-center text-base shadow"
                title="Abrir Notificaciones"
              >
                <span>🔔</span>
                {unreadBellCount > 0 && (
                  <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-extrabold flex items-center justify-center animate-bounce">
                    {unreadBellCount}
                  </span>
                )}
              </button>

              <button onClick={() => setQrModalOpen(true)} className="px-3 py-1.5 rounded-full nude-btn text-xs shadow">QR</button>
              <button onClick={handleLogout} className="px-2.5 py-1.5 rounded-full bg-burgundy-900 border border-nude-300/30 text-xs text-white font-semibold">Salir</button>
            </div>
          </header>

          {/* ========================================================== */}
          {/* PESTAÑA 1: MURO PRINCIPAL + TERMÓMETRO (ARRANCA EN 0%)      */}
          {/* ========================================================== */}
          {activeTab === "feed" && !viewedProfileUser && (
            <div className="p-4 space-y-5">

              {/* Banner si el Admin ya activó el Mosaico de Fin de Fiesta (#3) */}
              {partyState?.mosaicActive && (
                <div
                  onClick={() => { setActiveTab("party"); setPartySubTab("mosaic"); }}
                  className="match-card-letter rounded-2xl p-4 flex items-center justify-between cursor-pointer"
                >
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">📸</span>
                    <div>
                      <p className="text-xs font-extrabold text-amber-300 uppercase">¡Ya está listo el Póster Oficial!</p>
                      <p className="text-xs text-white font-semibold">Toca aquí para ver y descargar el Mosaico de los 100 invitados</p>
                    </div>
                  </div>
                  <span className="px-3 py-1 rounded-full bg-amber-300 text-[#090105] font-extrabold text-xs">Ver ✨</span>
                </div>
              )}

              {/* Termómetro de Energía del Sunset (Arranca en 0% real) */}
              <div className="glass-card rounded-2xl p-3.5 border border-amber-400/30 flex items-center gap-3">
                <span className="text-2xl animate-pulse">🔥</span>
                <div className="flex-1">
                  <div className="flex items-center justify-between text-xs font-bold mb-1">
                    <span className="text-white">Energía de la Fiesta</span>
                    <span className="text-amber-300">{sunsetEnergyPct}%</span>
                  </div>
                  <div className="w-full h-2 rounded-full bg-burgundy-950 overflow-hidden border border-nude-300/20">
                    <div className="h-full bg-gradient-to-r from-amber-400 via-rose-500 to-amber-300 transition-all duration-500" style={{ width: `${sunsetEnergyPct}%` }}></div>
                  </div>
                </div>
              </div>

              {/* Encuesta Relámpago en Vivo del Admin (#5) */}
              {partyState?.livePoll?.active && (
                <div className="match-card-letter rounded-3xl p-5 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-amber-300 text-[#090105] font-extrabold">
                      ⚡ Encuesta Relámpago en Vivo
                    </span>
                    <span className="text-xs text-amber-200 font-bold">Vota con 1 toque</span>
                  </div>
                  <h3 className="font-serif text-lg font-bold text-white">{partyState.livePoll.question}</h3>
                  <div className="space-y-2 pt-1">
                    {partyState.livePoll.options.map(opt => {
                      const votesObj = partyState.livePoll.votes || {};
                      const totalVotesCount = Object.keys(votesObj).length || 1;
                      const optVotesCount = Object.values(votesObj).filter(v => v === opt.id).length;
                      const pct = Math.round((optVotesCount / totalVotesCount) * 100);
                      const myVote = votesObj[currentUserDoc.uid] === opt.id;

                      return (
                        <button
                          key={opt.id}
                          onClick={() => handleVoteInLivePoll(opt.id)}
                          className={`w-full p-3 rounded-2xl text-left relative overflow-hidden transition border ${
                            myVote ? "bg-amber-400/30 border-amber-300" : "bg-burgundy-950/80 border-nude-300/30"
                          }`}
                        >
                          <div className="absolute left-0 top-0 bottom-0 bg-rose-500/25 transition-all" style={{ width: `${pct}%` }}></div>
                          <div className="relative z-10 flex items-center justify-between text-xs font-bold text-white">
                            <span>{opt.text} {myVote && "✓"}</span>
                            <span>{pct}% ({optVotesCount})</span>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Anuncio Fijado por el Admin */}
              {partyState?.pinnedAnnouncement && (
                <div className="glass-card rounded-2xl p-4 border border-amber-400/40 bg-burgundy-900/90 flex items-center gap-3">
                  <span className="text-2xl">📌</span>
                  <div>
                    <p className="text-[10px] uppercase font-bold text-amber-300">Aviso Oficial del Organizador</p>
                    <p className="text-xs text-white font-semibold">{partyState.pinnedAnnouncement}</p>
                  </div>
                </div>
              )}

              {/* Burbuja Ovalada de Historias */}
              <div className="stories-oval-bubble rounded-full px-5 py-3.5 flex items-center gap-3.5 overflow-x-auto no-scrollbar">
                <button
                  onClick={() => {
                    resetUploadStudio();
                    setUploadModal({ open: true, type: "story", withChallenge: false, isPaparazzi: false });
                  }}
                  className="flex flex-col items-center shrink-0"
                >
                  <div className="w-[60px] h-[60px] rounded-full bg-burgundy-950 border-2 border-dashed border-nude-300 flex items-center justify-center text-2xl text-nude-300 shadow-lg">+</div>
                  <span className="text-[10px] mt-1 text-nude-100 font-extrabold">Subir Story</span>
                </button>

                {storyGroups.map((group, gIdx) => {
                  const authorObj = users.find(u => u.uid === group.userId);
                  const online = isUserOnline(authorObj);
                  const hasUnseen = group.hasUnseen;

                  return (
                    <button
                      key={group.userId}
                      onClick={() => {
                        setStoryMenuOpen(false);
                        setStoryViewer({ open: true, groupIndex: gIdx, storyIndex: 0, paused: false, progress: 0 });
                      }}
                      className="flex flex-col items-center shrink-0 relative"
                    >
                      <div className={`w-[60px] h-[60px] rounded-full p-[2.5px] relative shadow-lg ${
                        hasUnseen ? "bg-gradient-to-tr from-amber-300 via-rose-500 to-nude-200" : "bg-neutral-600"
                      }`}>
                        <img src={group.userAvatar} alt="" className="w-full h-full object-cover rounded-full border-2 border-burgundy-950" />
                        {group.items.length > 1 && (
                          <span className="absolute -top-1 -right-1 px-1.5 py-0.2 rounded-full bg-nude-300 text-[#090105] font-extrabold text-[9px] border border-burgundy-950">
                            {group.items.length}
                          </span>
                        )}
                        <span className={`absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-burgundy-950 ${online ? "bg-emerald-500" : "bg-red-500"}`}></span>
                      </div>
                      <span className="text-[10px] mt-1 text-white font-bold truncate max-w-[68px]">@{group.userName}</span>
                    </button>
                  );
                })}
              </div>

              {/* Filtros Superiores del Muro */}
              <div className="grid grid-cols-3 gap-1.5 bg-burgundy-950 p-1 rounded-2xl border border-nude-300/30 text-xs">
                <button onClick={() => { setFeedFilter("recent"); setSelectedChallengeFilter(null); }} className={`py-2 rounded-xl font-bold transition ${feedFilter === "recent" && !selectedChallengeFilter ? "nude-btn" : "text-nude-200"}`}>🕒 Recientes</button>
                <button onClick={() => { setFeedFilter("trending"); setSelectedChallengeFilter(null); }} className={`py-2 rounded-xl font-bold transition ${feedFilter === "trending" ? "nude-btn" : "text-nude-200"}`}>🔥 Tendencias</button>
                <button onClick={() => { setFeedFilter("friends"); setSelectedChallengeFilter(null); }} className={`py-2 rounded-xl font-bold transition ${feedFilter === "friends" ? "nude-btn" : "text-nude-200"}`}>🥂 Amigos</button>
              </div>

              {/* Retos Secuenciales (1 al 20) */}
              <div className="glass-card rounded-2xl p-4 border border-nude-300/40">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-[10px] uppercase tracking-widest px-2.5 py-0.5 rounded-full nude-btn">Reto {challengeIndex + 1} de 20</span>
                  <button onClick={nextSequentialChallenge} className="text-xs text-nude-200 font-bold underline hover:text-white">⏭️ Siguiente reto</button>
                </div>
                <h3 className="text-base font-bold text-white flex items-center gap-2 mt-1">
                  <span className="text-xl">{currentChallenge.emoji}</span> {currentChallenge.title}
                </h3>
                <p className="text-xs text-nude-100 mt-1 mb-3">{currentChallenge.desc}</p>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => { resetUploadStudio(); setUploadModal({ open: true, type: "post", withChallenge: true, isPaparazzi: false }); }} className="py-2.5 px-3 rounded-xl nude-btn text-xs shadow">📸 Subir con Reto</button>
                  <button onClick={() => { resetUploadStudio(); setUploadModal({ open: true, type: "post", withChallenge: false, isPaparazzi: false }); }} className="py-2.5 px-3 rounded-xl bg-burgundy-800 border border-nude-300/40 text-white font-bold text-xs">✨ Subir Libre</button>
                </div>
              </div>

              {/* Muro Principal */}
              {sortedAndFilteredPosts.length === 0 ? (
                <div className="glass-card rounded-3xl p-8 text-center">
                  <p className="text-3xl mb-2">🌅</p>
                  <p className="text-base font-bold text-white">No hay publicaciones en esta sección</p>
                </div>
              ) : (
                sortedAndFilteredPosts.map((post) => {
                  const isLiked = (post.likes || []).includes(currentUserDoc.uid);
                  const canManage = post.userId === currentUserDoc.uid || isAdmin;
                  const authorObj = users.find(u => u.uid === post.userId);
                  const online = isUserOnline(authorObj);
                  const postReactions = post.reactions || {};
                  const authorBadges = userBadgesMap[post.userId] || [];

                  return (
                    <div key={post.id} className="glass-card rounded-3xl overflow-hidden">
                      <div className="p-3.5 flex items-center justify-between">
                        <button onClick={() => openUserProfile(post.userId)} className="flex items-center gap-2.5 text-left group">
                          <div className="relative">
                            <img src={authorObj?.avatar || post.userAvatar} alt="" className="w-10 h-10 rounded-full object-cover border border-nude-300/50" />
                            <span className={`absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-burgundy-950 ${online ? "bg-emerald-500" : "bg-red-500"}`}></span>
                          </div>
                          <div>
                            <div className="flex items-center gap-1.5 flex-wrap">
                              <p className="text-sm font-bold text-white group-hover:text-nude-300 transition">@{authorObj?.username || post.userName}</p>
                              {authorBadges.map((b, bi) => (
                                <span key={bi} className="text-[9px] px-1.5 py-0.2 rounded-full bg-amber-400 text-[#090105] font-extrabold">{b}</span>
                              ))}
                            </div>
                            <div className="flex items-center gap-2">
                              <span className="text-[10px] text-nude-300 font-semibold">{formatRelativeTime(post.createdAt)}</span>
                              {post.challengeTitle && <span className="text-[10px] text-amber-300 font-bold">• {post.challengeTitle}</span>}
                            </div>
                          </div>
                        </button>
                        {canManage && (
                          <div className="flex items-center gap-1.5">
                            <button
                              onClick={() => {
                                setBorderCrop(post.borderCrop || { top: 0, bottom: 0, left: 0, right: 0 });
                                setCropModalPost(post);
                              }}
                              className="text-xs px-2 py-1 rounded-lg nude-btn"
                              title="Recortar bordes"
                            >
                              ✂️
                            </button>
                            <button onClick={() => setAdminEditPost({ ...post })} className="text-xs text-nude-200 px-2 py-1 rounded-lg bg-burgundy-900 border border-nude-300/25">✏️</button>
                            <button onClick={() => handleDeletePost(post)} className="text-xs text-rose-300 px-2 py-1 rounded-lg bg-burgundy-950">🗑️</button>
                          </div>
                        )}
                      </div>

                      <div className="bg-black flex items-center justify-center overflow-hidden">
                        <MediaRenderer
                          item={post}
                          className="w-full max-h-[460px] object-contain cursor-pointer"
                          onDoubleTapLike={() => toggleLike(post)}
                          onOpenFullscreen={() => setFullscreenPostId(post.id)}
                        />
                      </div>

                      <div className="p-4 space-y-2.5">
                        <div className="flex items-center justify-between flex-wrap gap-2">
                          <div className="flex items-center gap-1.5">
                            <button onClick={() => toggleLike(post)} className={`flex items-center gap-1 text-xs font-extrabold px-3 py-1.5 rounded-full transition ${isLiked ? "bg-rose-500 text-white" : "light-surface"}`}>
                              <span>{isLiked ? "❤️" : "🤍"}</span>
                              <span onClick={(e) => { e.stopPropagation(); setLikesViewerList(post.likes || []); }} className="hover:underline">{post.likes?.length || 0}</span>
                            </button>
                            {/* Botón de Comentarios que lleva directo a la caja de comentarios */}
                            <button
                              onClick={() => {
                                const inputRef = commentInputRefs.current[post.id];
                                if (inputRef) {
                                  inputRef.focus();
                                  inputRef.scrollIntoView({ behavior: "smooth", block: "center" });
                                } else {
                                  setFullscreenPostId(post.id);
                                }
                              }}
                              className="flex items-center gap-1 text-xs font-bold px-3 py-1.5 rounded-full bg-burgundy-900 border border-nude-300/35 text-nude-100"
                              title="Ir a comentar"
                            >
                              <span>💬</span><span>{post.comments?.length || 0}</span>
                            </button>
                            <button onClick={() => setShareModalPost(post)} className="flex items-center gap-1 text-xs font-extrabold px-3 py-1.5 rounded-full nude-btn">
                              <span>📤</span><span>Enviar</span>
                            </button>
                            <button onClick={() => handleDownloadMedia(post.mediaUrl, post.mediaType)} className="flex items-center gap-1 text-xs font-bold px-2.5 py-1.5 rounded-full bg-burgundy-950 border border-nude-300/30 text-nude-200" title="Guardar">
                              <span>💾</span>
                            </button>
                          </div>

                          <div className="flex items-center gap-1">
                            {REACTION_EMOJIS.map((emo) => {
                              const arr = Array.isArray(postReactions[emo]) ? postReactions[emo] : [];
                              const iReacted = arr.includes(currentUserDoc.uid);
                              return (
                                <button key={emo} onClick={() => toggleReaction(post, emo)} className={`px-2 py-1 rounded-full text-xs font-extrabold flex items-center gap-1 border transition ${iReacted ? "bg-amber-300 text-[#090105] border-amber-200 scale-105" : "bg-burgundy-900 text-white border-nude-300/25"}`}>
                                  <span>{emo}</span>{arr.length > 0 && <span className="text-[11px]">{arr.length}</span>}
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        {post.caption && (
                          <p className="text-sm text-white">
                            <button onClick={() => openUserProfile(post.userId)} className="font-bold text-nude-300 mr-1.5 hover:underline">
                              @{authorObj?.username || post.userName}:
                            </button>
                            <RichMentionText text={post.caption} users={users} onOpenProfile={openUserProfile} />
                          </p>
                        )}

                        {(post.comments || []).length > 0 && (
                          <div className="space-y-1.5 pt-2 border-t border-nude-300/20 max-h-36 overflow-y-auto no-scrollbar">
                            {post.comments.map((c) => {
                              const canDelComment = c.userId === currentUserDoc.uid || post.userId === currentUserDoc.uid || isAdmin;
                              const cAuthor = users.find(u => u.uid === c.userId);
                              return (
                                <div key={c.id} className="flex items-center justify-between text-xs text-nude-100 gap-2">
                                  <p>
                                    <button onClick={() => openUserProfile(c.userId)} className="font-bold text-white mr-1.5 hover:underline">
                                      @{cAuthor?.username || c.userName}:
                                    </button>
                                    <RichMentionText text={c.text} users={users} onOpenProfile={openUserProfile} />
                                  </p>
                                  {canDelComment && <button onClick={() => handleDeleteComment(post, c)} className="text-[10px] text-rose-300">✕</button>}
                                </div>
                              );
                            })}
                          </div>
                        )}

                        <div className="pt-1">
                          <MentionAutocompleteBar
                            value={commentInputs[post.id] || ""}
                            onChange={(newVal) => setCommentInputs(prev => ({ ...prev, [post.id]: newVal }))}
                            users={users}
                            label="Arrobar en comentario:"
                          />
                          <div className="flex items-center gap-2">
                            <input
                              type="text"
                              ref={(el) => { if (el) commentInputRefs.current[post.id] = el; }}
                              placeholder="Escribe un comentario o etiqueta con @usuario..."
                              value={commentInputs[post.id] || ""}
                              onChange={(e) => setCommentInputs(prev => ({ ...prev, [post.id]: e.target.value }))}
                              onKeyDown={(e) => e.key === "Enter" && handleAddComment(post.id)}
                              className="flex-1 px-3.5 py-2 rounded-full bg-burgundy-950 border border-nude-300/35 text-xs text-white placeholder-nude-300/50 focus:outline-none"
                            />
                            <button onClick={() => handleAddComment(post.id)} className="px-4 py-2 rounded-full nude-btn text-xs">Comentar</button>
                          </div>
                        </div>
                      </div>
