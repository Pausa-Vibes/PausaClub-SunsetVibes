      // ====================================================================
      // SOLICITUDES DE AMISTAD Y FUEGUITO DE MATCH (🔥)
      // ====================================================================
      const getRelationshipStatus = (targetUser) => {
        if (!currentUserDoc || !targetUser) return "none";
        if ((currentUserDoc.friends || []).includes(targetUser.uid)) return "friends";
        const pendingReq = notifications.find(
          n => n.type === "friend_request" && n.status === "pending" &&
               n.fromUid === currentUserDoc.uid && n.toUid === targetUser.uid
        );
        if (pendingReq) return "requested";
        const incomingReq = notifications.find(
          n => n.type === "friend_request" && n.status === "pending" &&
               n.fromUid === targetUser.uid && n.toUid === currentUserDoc.uid
        );
        if (incomingReq) return "incoming";
        return "none";
      };

      // Enviar solicitud de amistad o eliminar amigo
      const handleFriendAction = async (targetUser) => {
        if (!currentUserDoc || !window.FB || !targetUser) return;
        const { db, doc, updateDoc, arrayRemove } = window.FB;
        const status = getRelationshipStatus(targetUser);

        if (status === "friends") {
          if (!confirm(`¿Seguro que deseas eliminar a @${targetUser.username} de tus amigos?`)) return;
          try {
            await updateDoc(doc(db, "users", currentUserDoc.uid), { friends: arrayRemove(targetUser.uid) });
            await updateDoc(doc(db, "users", targetUser.uid), { friends: arrayRemove(currentUserDoc.uid) });
          } catch (e) {}
          return;
        }

        if (status === "requested") {
          alert(`Ya le enviaste una solicitud de amistad a @${targetUser.username}.`);
          return;
        }

        if (status === "incoming") {
          const inc = notifications.find(
            n => n.type === "friend_request" && n.status === "pending" &&
                 n.fromUid === targetUser.uid && n.toUid === currentUserDoc.uid
          );
          if (inc) await handleRespondFriendRequest(inc, true);
          return;
        }

        await sendNotification({
          toUid: targetUser.uid,
          type: "friend_request",
          text: `quiere seguirte y ser tu amigo en el Sunset 🥂`,
          status: "pending"
        });
        setInAppToast({
          id: Date.now(),
          icon: "🥂",
          title: `Solicitud enviada a @${targetUser.username}`,
          text: "Recibirá la notificación en su campanita",
          action: () => setInAppToast(null)
        });
      };

      // Aceptar o Denegar Solicitud de Amistad desde la Campanita
      const handleRespondFriendRequest = async (notif, accept) => {
        if (!currentUserDoc || !window.FB) return;
        const { db, doc, updateDoc, arrayUnion } = window.FB;
        try {
          await updateDoc(doc(db, "notifications", notif.id), {
            status: accept ? "accepted" : "denied",
            read: true
          });

          if (accept) {
            await updateDoc(doc(db, "users", currentUserDoc.uid), {
              friends: arrayUnion(notif.fromUid)
            });
            await updateDoc(doc(db, "users", notif.fromUid), {
              friends: arrayUnion(currentUserDoc.uid)
            });
            await sendNotification({
              toUid: notif.fromUid,
              type: "friend_accepted",
              text: `aceptó tu solicitud de amistad. ¡Ya son amigos y pueden chatear en privado! 🎉`,
              status: "info"
            });
          } else {
            await sendNotification({
              toUid: notif.fromUid,
              type: "friend_denied",
              text: `denegó la solicitud de amistad.`,
              status: "info"
            });
          }
        } catch (e) {}
      };

      // Tocar el Fueguito de Match (🔥) en el perfil de otra persona
      const handleSendFireMatch = async (targetUser) => {
        if (!currentUserDoc || !targetUser || !window.FB) return;
        const existingMatches = Array.isArray(targetUser.matchesReceived) ? targetUser.matchesReceived : [];
        const alreadySent = existingMatches.some(m => m.fromUid === currentUserDoc.uid);
        if (alreadySent) {
          alert(`¡Ya le enviaste un Fuego de Match 🔥 a @${targetUser.username}!`);
          return;
        }

        const newMatchEntry = {
          id: "m_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          fromUid: currentUserDoc.uid,
          fromUsername: currentUserDoc.username,
          fromAvatar: currentUserDoc.avatar,
          status: "pending", // 'pending' | 'accepted' | 'denied'
          createdAt: Date.now()
        };

        try {
          await window.FB.updateDoc(window.FB.doc(window.FB.db, "users", targetUser.uid), {
            matchesReceived: [...existingMatches, newMatchEntry]
          });
          await sendNotification({
            toUid: targetUser.uid,
            type: "match_received",
            text: `🔥 ¡Te dio un Fuego de Match en tu perfil! Entra a tu perfil para abrir tu Carta Especial.`,
            status: "info"
          });
          setInAppToast({
            id: Date.now(),
            icon: "🔥",
            title: `¡Match enviado a @${targetUser.username}!`,
            text: "Le aparecerá una carta mágica cuando entre a su perfil",
            action: () => setInAppToast(null)
          });
        } catch (e) {}
      };

      // Aceptar o Denegar la Carta de Match en Mi Perfil (o desde la Cajita de Matches)
      const handleRespondMatchCard = async (matchEntry, accept) => {
        if (!currentUserDoc || !window.FB || !matchEntry) return;
        const { db, doc, updateDoc, arrayUnion } = window.FB;
        const currentList = Array.isArray(currentUserDoc.matchesReceived) ? [...currentUserDoc.matchesReceived] : [];
        const updatedList = currentList.map(m =>
          m.fromUid === matchEntry.fromUid ? { ...m, status: accept ? "accepted" : "denied" } : m
        );

        try {
          const myUpdate = { matchesReceived: updatedList };
          if (accept) {
            myUpdate.friends = arrayUnion(matchEntry.fromUid);
          }
          await updateDoc(doc(db, "users", currentUserDoc.uid), myUpdate);

          if (accept) {
            await updateDoc(doc(db, "users", matchEntry.fromUid), {
              friends: arrayUnion(currentUserDoc.uid)
            });
            await sendNotification({
              toUid: matchEntry.fromUid,
              type: "match_accepted",
              text: `🔥💖 ¡Aceptó tu Carta de Match! Ahora son amigos oficialmente y tienen el chat privado habilitado.`,
              status: "info"
            });
            setInAppToast({
              id: Date.now(),
              icon: "💖",
              title: `¡Match con @${matchEntry.fromUsername}!`,
              text: "Ahora son amigos y pueden chatear en privado",
              action: () => {
                const fObj = users.find(u => u.uid === matchEntry.fromUid);
                if (fObj) {
                  setActiveTab("chat");
                  setChatSubTab("private");
                  setActiveChatFriend(fObj);
                }
                setInAppToast(null);
              }
            });
          } else {
            await sendNotification({
              toUid: matchEntry.fromUid,
              type: "match_denied",
              text: `vio tu carta de Match pero decidió pasar por ahora.`,
              status: "info"
            });
          }
        } catch (e) {}
      };

      // ====================================================================
      // AUTENTICACIÓN
      // ====================================================================
      const handleGoogleSignIn = async () => {
        setAuthError("");
        if (!window.FB) return;
        try {
          await window.FB.signInWithPopup(window.FB.auth, window.FB.googleProvider);
        } catch (err) {
          setAuthError("Para usar el botón de Google en un dominio nuevo, agrégalo en Firebase > Authentication > Dominios autorizados, o entra abajo con tu @usuario y contraseña.");
        }
      };

      const handleUsernamePasswordAuth = async (e) => {
        e.preventDefault();
        setAuthError("");
        const cleanUser = loginUsername.trim().replace(/^@/, "").replace(/\s+/g, "_");
        const cleanPass = loginPassword.trim();

        if (cleanUser.length < 3 || cleanPass.length < 4) {
          setAuthError("El @usuario debe tener mínimo 3 caracteres y la contraseña mínimo 4.");
          return;
        }

        const matchedUser = users.find(
          u => (u.username || "").toLowerCase() === cleanUser.toLowerCase() ||
               (u.email || "").toLowerCase() === loginUsername.trim().toLowerCase()
        );

        if (authMode === "login") {
          if (!matchedUser) {
            setAuthError(`No encontramos a @${cleanUser}. Usa la pestaña "Registrar @Usuario".`);
            return;
          }
          if (matchedUser.password && matchedUser.password !== cleanPass) {
            setAuthError("Contraseña incorrecta.");
            return;
          }
          const sessionObj = {
            uid: matchedUser.uid,
            email: matchedUser.email || `${cleanUser.toLowerCase()}@sunset.local`,
            defaultName: matchedUser.username,
            defaultAvatar: matchedUser.avatar
          };
          localStorage.setItem("sunset_vibes_session", JSON.stringify(sessionObj));
          setAuthSession(sessionObj);
        } else {
          if (matchedUser) {
            setAuthError(`El usuario @${cleanUser} ya está registrado.`);
            return;
          }
          const isEmailInput = loginUsername.includes("@") && loginUsername.includes(".");
          const uid = "u_" + btoa(cleanUser.toLowerCase() + "_" + Date.now()).replace(/[^a-zA-Z0-9]/g, "").slice(0, 18);
          const emailVal = isEmailInput ? loginUsername.trim().toLowerCase() : `${cleanUser.toLowerCase()}@sunset.local`;
          let avatarVal = setupAvatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(cleanUser)}`;

          if (setupAvatar && setupAvatar.startsWith("data:")) {
            try { avatarVal = await uploadToCloudinary(setupAvatar, "image"); } catch (e) {}
          }

          const newProfile = {
            uid,
            username: cleanUser,
            name: cleanUser,
            password: cleanPass,
            email: emailVal,
            avatar: avatarVal,
            friends: [],
            matchesReceived: [],
            isOnline: true,
            lastSeen: Date.now(),
            updatedAt: Date.now()
          };

          try {
            await window.FB.setDoc(window.FB.doc(window.FB.db, "users", uid), newProfile, { merge: true });
            const sessionObj = { uid, email: emailVal, defaultName: cleanUser, defaultAvatar: avatarVal };
            localStorage.setItem("sunset_vibes_session", JSON.stringify(sessionObj));
            setAuthSession(sessionObj);
          } catch (err) {
            setAuthError("Error al registrar usuario en Firestore.");
          }
        }
      };

      const handleCompleteGoogleProfile = async (e) => {
        e.preventDefault();
        setSetupError("");
        const cleanUser = setupUsername.trim().replace(/^@/, "").replace(/\s+/g, "_");
        const cleanPass = setupPassword.trim();

        if (cleanUser.length < 3) {
          setSetupError("El @usuario debe tener al menos 3 caracteres.");
          return;
        }
        if (cleanPass.length < 4) {
          setSetupError("Crea una contraseña de al menos 4 caracteres.");
          return;
        }
        const isTaken = users.some(
          u => u.uid !== authSession.uid && (u.username || "").toLowerCase() === cleanUser.toLowerCase()
        );
        if (isTaken) {
          setSetupError(`El usuario @${cleanUser} ya está ocupado.`);
          return;
        }

        let finalAvatar = setupAvatar || authSession.defaultAvatar;
        if (setupAvatar && setupAvatar.startsWith("data:")) {
          try { finalAvatar = await uploadToCloudinary(setupAvatar, "image"); } catch (e) {}
        }

        const profileData = {
          uid: authSession.uid,
          username: cleanUser,
          name: cleanUser,
          password: cleanPass,
          email: authSession.email,
          avatar: finalAvatar,
          friends: [],
          matchesReceived: [],
          isOnline: true,
          lastSeen: Date.now(),
          updatedAt: Date.now()
        };

        try {
          await window.FB.setDoc(window.FB.doc(window.FB.db, "users", authSession.uid), profileData, { merge: true });
          localStorage.setItem("sunset_vibes_session", JSON.stringify(authSession));
        } catch (err) {
          setSetupError("Error guardando perfil.");
        }
      };

      const handleLogout = async () => {
        if (currentUserDoc && window.FB) {
          try {
            await window.FB.updateDoc(window.FB.doc(window.FB.db, "users", currentUserDoc.uid), {
              isOnline: false,
              lastSeen: 0
            });
          } catch (e) {}
        }
        localStorage.removeItem("sunset_vibes_session");
        if (window.FB) {
          try { await window.FB.fbSignOut(window.FB.auth); } catch (e) {}
        }
        setAuthSession(null);
        setViewedProfileUid(null);
        setActiveTab("feed");
      };

      // ====================================================================
      // ESTUDIO DE SUBIDA Y NOTIFICACIÓN AUTOMÁTICA A AMIGOS
      // ====================================================================
      const resetUploadStudio = () => {
        setRawMediaUrl("");
        setRawVideoFile(null);
        setMediaType("image");
        setVideoDuration(0);
        setSelectedFilter(MEDIA_FILTERS[0]);
        setSelectedCrop(CROP_RATIOS[0]);
        setOverlayText("");
        setOverlayColor(TEXT_COLORS[0]);
        setOverlayYPos(50);
        setPlacedStickers([]);
        setDraggingStickerId(null);
        setCaption("");
        setMediaError("");
        setUploadProgress(0);
      };

      const addStickerToCanvas = (emoji) => {
        const offset = (placedStickers.length * 9) % 40;
        setPlacedStickers(prev => [
          ...prev,
          { id: "st_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5), emoji, x: 30 + offset, y: 25 + offset }
        ]);
      };

      const removeStickerFromCanvas = (id) => {
        setPlacedStickers(prev => prev.filter(s => s.id !== id));
      };

      const handleStickerPointerMove = (clientX, clientY) => {
        if (!draggingStickerId || !previewBoxRef.current) return;
        const rect = previewBoxRef.current.getBoundingClientRect();
        const xPct = Math.max(8, Math.min(92, ((clientX - rect.left) / rect.width) * 100));
        const yPct = Math.max(8, Math.min(92, ((clientY - rect.top) / rect.height) * 100));
        setPlacedStickers(prev =>
          prev.map(st => st.id === draggingStickerId ? { ...st, x: Math.round(xPct), y: Math.round(yPct) } : st)
        );
      };

      const handleMediaFileChange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setMediaError("");

        if (file.type.startsWith("video/")) {
          try {
            const { previewUrl, duration } = await validateVideoFile(file);
            setMediaType("video");
            setVideoDuration(duration);
            setRawVideoFile(file);
            setRawMediaUrl(previewUrl);
          } catch (err) {
            setMediaError(err.message);
            setRawMediaUrl("");
            setRawVideoFile(null);
          }
        } else {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (ev) => {
            setMediaType("image");
            setVideoDuration(0);
            setRawVideoFile(null);
            setRawMediaUrl(ev.target.result);
          };
        }
      };

      const handlePublishEditedMedia = async (e) => {
        e.preventDefault();
        if (!rawMediaUrl || !currentUserDoc || isSubmitting) return;
        setIsSubmitting(true);
        setUploadProgress(5);
        setMediaError("");
        const { db, collection, addDoc } = window.FB;

        try {
          let finalCloudUrl = "";

          if (mediaType === "image") {
            const hdBakedDataUrl = await bakeEditedImage(rawMediaUrl, {
              filterCss: selectedFilter.css,
              cropRatio: selectedCrop.ratio,
              overlayText,
              textColorObj: overlayColor,
              textYPos: overlayYPos,
              stickers: placedStickers,
              maxDim: 1920,
              quality: 0.92
            });

            try {
              finalCloudUrl = await uploadToCloudinary(hdBakedDataUrl, "image", (pct) => setUploadProgress(pct));
            } catch (cloudErr) {
              finalCloudUrl = await bakeEditedImage(rawMediaUrl, {
                filterCss: selectedFilter.css,
                cropRatio: selectedCrop.ratio,
                overlayText,
                textColorObj: overlayColor,
                textYPos: overlayYPos,
                stickers: placedStickers,
                maxDim: 820,
                quality: 0.74
              });
            }
          } else {
            const videoSource = rawVideoFile || rawMediaUrl;
            finalCloudUrl = await uploadToCloudinary(videoSource, "video", (pct) => setUploadProgress(pct));
          }

          const basePayload = {
            userId: currentUserDoc.uid,
            userName: currentUserDoc.username,
            userAvatar: currentUserDoc.avatar,
            mediaUrl: finalCloudUrl,
            mediaType,
            videoDuration: mediaType === "video" ? videoDuration : null,
            filterId: mediaType === "video" ? selectedFilter.id : "normal",
            cropId: selectedCrop.id,
            overlayText: mediaType === "video" ? overlayText.trim() : "",
            overlayColorId: overlayColor.id,
            overlayYPos,
            overlayStickers: mediaType === "video" ? placedStickers : [],
            caption: caption.trim(),
            createdAt: Date.now()
          };

          const myFriendsList = currentUserDoc.friends || [];

          if (uploadModal.type === "story") {
            await addDoc(collection(db, "stories"), basePayload);
            // Notificar a todos los amigos que subió una nueva historia
            myFriendsList.forEach(friendUid => {
              sendNotification({
                toUid: friendUid,
                type: "friend_story",
                text: `🌅 subió una nueva historia. ¡Toca para verla!`,
                storyUserId: currentUserDoc.uid
              });
            });
          } else {
            const createdDoc = await addDoc(collection(db, "posts"), {
              ...basePayload,
              challengeId: uploadModal.withChallenge ? currentChallenge.id : null,
              challengeTitle: uploadModal.withChallenge ? `${currentChallenge.emoji} ${currentChallenge.title}` : null,
              likes: [],
              reactions: {},
              comments: []
            });
            // Notificar a todos los amigos que subió una nueva publicación
            myFriendsList.forEach(friendUid => {
              sendNotification({
                toUid: friendUid,
                type: "friend_post",
                text: `📸 subió una nueva ${mediaType === "video" ? "publicación de video" : "foto"} al muro.`,
                postId: createdDoc.id
              });
            });
          }

          resetUploadStudio();
          setUploadModal({ open: false, type: "post", withChallenge: false });
        } catch (err) {
          setMediaError(err.message || "Error al subir el archivo.");
        } finally {
          setIsSubmitting(false);
          setUploadProgress(0);
        }
      };

      const handleApplyBorderCrop = async () => {
        if (!cropModalPost || isCroppingPost || !window.FB) return;
        setIsCroppingPost(true);
        try {
          const croppedDataUrl = await cropImageByBorders(cropModalPost.mediaUrl, borderCrop);
          let finalUrl = croppedDataUrl;
          try {
            finalUrl = await uploadToCloudinary(croppedDataUrl, "image");
          } catch (e) {}

          await window.FB.updateDoc(window.FB.doc(window.FB.db, "posts", cropModalPost.id), {
            mediaUrl: finalUrl
          });
          setCropModalPost(null);
          setBorderCrop({ top: 0, bottom: 0, left: 0, right: 0 });
        } catch (err) {
          alert("No se pudo recortar la imagen.");
        } finally {
          setIsCroppingPost(false);
        }
      };

      // ====================================================================
      // LIKES, REACCIONES, COMENTARIOS (CON AVISO A LA CAMPANITA)
      // ====================================================================
      const toggleLike = async (post) => {
        if (!currentUserDoc || !window.FB) return;
        const { db, doc, updateDoc, arrayUnion, arrayRemove } = window.FB;
        const hasLiked = (post.likes || []).includes(currentUserDoc.uid);
        try {
          await updateDoc(doc(db, "posts", post.id), {
            likes: hasLiked ? arrayRemove(currentUserDoc.uid) : arrayUnion(currentUserDoc.uid)
          });
          if (!hasLiked && post.userId !== currentUserDoc.uid) {
            sendNotification({
              toUid: post.userId,
              type: "like",
              text: `❤️ le dio Me gusta a tu publicación.`,
              postId: post.id
            });
          }
        } catch (e) {}
      };

      const toggleReaction = async (post, emoji) => {
        if (!currentUserDoc || !window.FB) return;
        const currentReactions = post.reactions ? { ...post.reactions } : {};
        const usersForEmoji = Array.isArray(currentReactions[emoji]) ? [...currentReactions[emoji]] : [];
        const idx = usersForEmoji.indexOf(currentUserDoc.uid);

        if (idx > -1) {
          usersForEmoji.splice(idx, 1);
        } else {
          usersForEmoji.push(currentUserDoc.uid);
        }
        currentReactions[emoji] = usersForEmoji;

        try {
          await window.FB.updateDoc(window.FB.doc(window.FB.db, "posts", post.id), {
            reactions: currentReactions
          });
          if (idx === -1 && post.userId !== currentUserDoc.uid) {
            sendNotification({
              toUid: post.userId,
              type: "reaction",
              text: `reaccionó con ${emoji} a tu publicación.`,
              postId: post.id
            });
          }
        } catch (e) {}
      };

      const handleAddComment = async (postId) => {
        const text = (commentInputs[postId] || "").trim();
        if (!text || !currentUserDoc || !window.FB) return;
        const { db, doc, updateDoc, arrayUnion } = window.FB;
        const targetPost = posts.find(p => p.id === postId);
        const newComment = {
          id: "c_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          userId: currentUserDoc.uid,
          userName: currentUserDoc.username,
          userAvatar: currentUserDoc.avatar,
          text,
          createdAt: Date.now()
        };
        try {
          await updateDoc(doc(db, "posts", postId), { comments: arrayUnion(newComment) });
          setCommentInputs(prev => ({ ...prev, [postId]: "" }));
          if (targetPost && targetPost.userId !== currentUserDoc.uid) {
            sendNotification({
              toUid: targetPost.userId,
              type: "comment",
              text: `💬 comentó en tu publicación: "${text.slice(0, 40)}"`,
              postId
            });
          }
        } catch (e) {}
      };

      const handleDeleteComment = async (post, commentObj) => {
        if (!currentUserDoc || !window.FB) return;
        if (commentObj.userId !== currentUserDoc.uid && post.userId !== currentUserDoc.uid && !isAdmin) return;
        const updated = (post.comments || []).filter(c => c.id !== commentObj.id);
        try {
          await window.FB.updateDoc(window.FB.doc(window.FB.db, "posts", post.id), { comments: updated });
        } catch (e) {}
      };

      const handleDeletePost = async (post) => {
        if (!currentUserDoc || !window.FB) return;
        if (post.userId !== currentUserDoc.uid && !isAdmin) return;
        if (!confirm("¿Eliminar esta publicación permanentemente?")) return;
        try {
          await window.FB.deleteDoc(window.FB.doc(window.FB.db, "posts", post.id));
          if (fullscreenPostId === post.id) setFullscreenPostId(null);
        } catch (e) {}
      };

      const handleDeleteStory = async (story) => {
        if (!currentUserDoc || !window.FB) return;
        if (story.userId !== currentUserDoc.uid && !isAdmin) return;
        if (!confirm("¿Eliminar esta historia?")) return;
        try {
          await window.FB.deleteDoc(window.FB.doc(window.FB.db, "stories", story.id));
          setStoryViewer({ open: false, groupIndex: 0, storyIndex: 0, paused: false, progress: 0 });
        } catch (e) {}
      };

      const handleSavePostEdit = async (e) => {
        e.preventDefault();
        if (!adminEditPost || !window.FB) return;
        try {
          await window.FB.updateDoc(window.FB.doc(window.FB.db, "posts", adminEditPost.id), {
            caption: adminEditPost.caption,
            challengeTitle: adminEditPost.challengeTitle || null
          });
          setAdminEditPost(null);
        } catch (e) {}
      };

      const handleDeleteMessage = async (msg) => {
        if (!currentUserDoc || !window.FB) return;
        if (msg.senderId !== currentUserDoc.uid && !isAdmin) return;
        if (!confirm("¿Borrar este mensaje del chat?")) return;
        try {
          await window.FB.deleteDoc(window.FB.doc(window.FB.db, "messages", msg.id));
        } catch (e) {}
      };

      const handleAdminSaveUser = async (e) => {
        e.preventDefault();
        if (!isAdmin || !adminEditUser || !window.FB) return;
        const cleanU = adminEditUser.username.trim().replace(/^@/, "").replace(/\s+/g, "_");
        try {
          await window.FB.updateDoc(window.FB.doc(window.FB.db, "users", adminEditUser.uid), {
            username: cleanU,
            name: cleanU
          });
          setAdminEditUser(null);
        } catch (e) {}
      };

      const handleAdminDeleteUser = async (targetUser) => {
        if (!isAdmin || !window.FB) return;
        if (!confirm(`¿Eliminar el perfil de @${targetUser.username} y todas sus publicaciones?`)) return;
        const { db, doc, deleteDoc } = window.FB;
        try {
          await deleteDoc(doc(db, "users", targetUser.uid));
          posts.filter(p => p.userId === targetUser.uid).forEach(p => deleteDoc(doc(db, "posts", p.id)));
          stories.filter(s => s.userId === targetUser.uid).forEach(s => deleteDoc(doc(db, "stories", s.id)));
          if (viewedProfileUid === targetUser.uid) setViewedProfileUid(null);
        } catch (e) {}
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!chatText.trim() || !currentUserDoc || !window.FB) return;
        const { db, collection, addDoc } = window.FB;
        const isGroup = chatSubTab === "group" || !activeChatFriend;
        const chatKey = isGroup
          ? "GLOBAL_GROUP"
          : [currentUserDoc.uid, activeChatFriend.uid].sort().join("__");

        try {
          await addDoc(collection(db, "messages"), {
            chatKey,
            senderId: currentUserDoc.uid,
            senderName: currentUserDoc.username,
            senderAvatar: currentUserDoc.avatar,
            receiverId: isGroup ? "ALL" : activeChatFriend.uid,
            text: chatText.trim(),
            sharedMediaUrl: null,
            sharedMediaType: null,
            createdAt: Date.now()
          });
          setChatText("");
        } catch (e) {}
      };

      const handleSendPostToChat = async (targetType, targetFriend = null) => {
        if (!shareModalPost || !currentUserDoc || !window.FB) return;
        const { db, collection, addDoc } = window.FB;
        const chatKey = targetType === "group"
          ? "GLOBAL_GROUP"
          : [currentUserDoc.uid, targetFriend.uid].sort().join("__");

        try {
          await addDoc(collection(db, "messages"), {
            chatKey,
            senderId: currentUserDoc.uid,
            senderName: currentUserDoc.username,
            senderAvatar: currentUserDoc.avatar,
            receiverId: targetType === "group" ? "ALL" : targetFriend.uid,
            text: `Compartió de @${shareModalPost.userName}${shareModalPost.caption ? `: "${shareModalPost.caption}"` : ""}`,
            sharedMediaUrl: shareModalPost.mediaUrl,
            sharedMediaType: shareModalPost.mediaType || "image",
            sharedPostId: shareModalPost.id,
            createdAt: Date.now()
          });
          setShareModalPost(null);
          setFullscreenPostId(null);
          setViewedProfileUid(null);
          setStoryViewer(prev => ({ ...prev, open: false }));
          setActiveTab("chat");
          if (targetType === "group") {
            setChatSubTab("group");
            setActiveChatFriend(null);
          } else {
            setChatSubTab("private");
            setActiveChatFriend(targetFriend);
          }
        } catch (e) {}
      };

      const handleExternalShare = async (item) => {
        const shareData = {
          title: "Sunset Vibes",
          text: `Mira esta publicación de @${item.userName} en Sunset Vibes`,
          url: window.location.href
        };
        if (navigator.share) {
          try { await navigator.share(shareData); } catch (e) {}
        } else {
          navigator.clipboard?.writeText(window.location.href);
          alert("¡Enlace copiado al portapapeles!");
        }
      };

      const handleSaveProfileEdit = async (e) => {
        e.preventDefault();
        setProfileEditError("");
        if (!currentUserDoc || !window.FB) return;

        const cleanU = (newProfileUsername || currentUserDoc.username).trim().replace(/^@/, "").replace(/\s+/g, "_");
        if (cleanU.length < 3) {
          setProfileEditError("El @usuario debe tener al menos 3 caracteres.");
          return;
        }
        const isTaken = users.some(
          u => u.uid !== currentUserDoc.uid && (u.username || "").toLowerCase() === cleanU.toLowerCase()
        );
        if (isTaken) {
          setProfileEditError(`El nombre @${cleanU} ya está ocupado.`);
          return;
        }

        let finalAvatarUrl = newProfileAvatar || currentUserDoc.avatar;
        if (newProfileAvatar && newProfileAvatar.startsWith("data:")) {
          try {
            finalAvatarUrl = await uploadToCloudinary(newProfileAvatar, "image");
          } catch (e) {}
        }

        const updatePayload = {
          username: cleanU,
          name: cleanU,
          avatar: finalAvatarUrl,
          lastSeen: Date.now()
        };
        if (newProfilePassword.trim().length >= 4) {
          updatePayload.password = newProfilePassword.trim();
        }

        try {
          await window.FB.updateDoc(window.FB.doc(window.FB.db, "users", currentUserDoc.uid), updatePayload);
          setEditProfileModal(false);
        } catch (e) {
          setProfileEditError("Error al guardar cambios.");
        }
      };

      const myPosts = posts.filter(p => p.userId === currentUserDoc?.uid);
      const myStories = stories.filter(s => s.userId === currentUserDoc?.uid);
      const myTotalLikes = myPosts.reduce((s, p) => s + (p.likes?.length || 0), 0);
      const myTotalComments = myPosts.reduce((s, p) => s + (p.comments?.length || 0), 0);

      const myFriendUsers = useMemo(() => {
        if (!currentUserDoc) return [];
        const friendIds = currentUserDoc.friends || [];
        return users.filter(u => u.uid !== currentUserDoc.uid && u.username && friendIds.includes(u.uid));
      }, [users, currentUserDoc]);

      const guestStats = useMemo(() => {
        return users.filter(u => u.username).map(u => {
          const uPosts = posts.filter(p => p.userId === u.uid);
          const uStories = stories.filter(s => s.userId === u.uid);
          return {
            ...u,
            postsCount: uPosts.length,
            storiesCount: uStories.length,
            likesReceived: uPosts.reduce((s, p) => s + (p.likes?.length || 0), 0),
            commentsReceived: uPosts.reduce((s, p) => s + (p.comments?.length || 0), 0),
            challengesDone: uPosts.filter(p => !!p.challengeTitle).length
          };
        });
      }, [users, posts, stories]);

      const filteredSearchUsers = useMemo(() => {
        const q = searchQuery.trim().replace(/^@/, "").toLowerCase();
        return users
          .filter(u => u.username)
          .filter(u => !q || u.username.toLowerCase().includes(q));
      }, [users, searchQuery]);
      // ====================================================================
      // PANTALLA 1: BIENVENIDA E INICIO DE SESIÓN
      // ====================================================================
      if (!authSession) {
        return (
          <div className="min-h-screen flex flex-col justify-between items-center p-5 relative overflow-hidden">
            <div className="w-full max-w-md z-10 my-auto">
              <div className="glass-card rounded-3xl p-7 text-center border border-nude-300/40">
                <div className="mx-auto w-20 h-20 rounded-full bg-gradient-to-tr from-burgundy-800 via-rose-500 to-amber-300 p-1 shadow-2xl mb-3 flex items-center justify-center">
                  <div className="w-full h-full rounded-full bg-burgundy-950 flex flex-col items-center justify-center">
                    <span className="text-2xl">🌅</span>
                    <span className="text-[8px] tracking-widest uppercase text-nude-300 font-bold">Sunset</span>
                  </div>
                </div>

                <h1 className="font-serif text-3xl font-bold text-white">Sunset Vibes</h1>
                <p className="text-[11px] uppercase tracking-[0.22em] text-nude-300 font-bold mb-4">
                  La Red Social Oficial del Evento
                </p>

                <div className="min-h-[46px] flex items-center justify-center px-3 py-1.5 mb-5 rounded-2xl bg-burgundy-950/90 border border-nude-300/20">
                  <p className="text-xs italic text-nude-100">{INSPIRATIONAL_QUOTES[quoteIndex]}</p>
                </div>

                <button
                  onClick={handleGoogleSignIn}
                  className="w-full py-3.5 px-5 rounded-2xl bg-white text-[#090105] font-extrabold text-sm flex items-center justify-center gap-3 shadow-xl hover:bg-nude-100 transition"
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
                    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
                    <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"/>
                    <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5L1.6 17c1.9 3.9 5.8 7 10.4 7z"/>
                  </svg>
                  Continuar con Google
                </button>

                <div className="my-4 flex items-center gap-3">
                  <div className="h-px flex-1 bg-nude-300/25"></div>
                  <span className="text-[10px] uppercase tracking-wider text-nude-300 font-bold">
                    O con @usuario y contraseña
                  </span>
                  <div className="h-px flex-1 bg-nude-300/25"></div>
                </div>

                <div className="grid grid-cols-2 gap-1.5 bg-burgundy-950 p-1 rounded-xl border border-nude-300/25 mb-4">
                  <button
                    type="button"
                    onClick={() => { setAuthMode("login"); setAuthError(""); }}
                    className={`py-2 rounded-lg text-xs font-extrabold transition ${
                      authMode === "login" ? "nude-btn" : "text-nude-200"
                    }`}
                  >
                    Iniciar Sesión
                  </button>
                  <button
                    type="button"
                    onClick={() => { setAuthMode("register"); setAuthError(""); }}
                    className={`py-2 rounded-lg text-xs font-extrabold transition ${
                      authMode === "register" ? "nude-btn" : "text-nude-200"
                    }`}
                  >
                    Registrar @Usuario
                  </button>
                </div>

                <form onSubmit={handleUsernamePasswordAuth} className="space-y-3 text-left">
                  {authMode === "register" && (
                    <div className="flex flex-col items-center pb-1">
                      <label className="cursor-pointer text-center">
                        <img
                          src={setupAvatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(loginUsername || "sunset")}`}
                          alt=""
                          className="w-16 h-16 rounded-full object-cover mx-auto border-2 border-nude-300"
                        />
                        <span className="mt-1.5 inline-block text-[11px] px-3 py-0.5 rounded-full nude-btn">
                          📷 Elegir foto de perfil
                        </span>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={async (e) => {
                            const f = e.target.files?.[0];
                            if (f) setSetupAvatar(await compressSimpleImage(f));
                          }}
                          className="hidden"
                        />
                      </label>
                    </div>
                  )}

                  <div>
                    <label className="text-xs text-nude-200 font-bold ml-1">
                      {authMode === "login" ? "Tu @usuario único" : "Elige tu @usuario único (no repetible)"}
                    </label>
                    <div className="relative mt-1">
                      <span className="absolute left-3.5 top-3 text-nude-300 font-bold text-sm">@</span>
                      <input
                        type="text"
                        required
                        placeholder="ej. joel_sunset"
                        value={loginUsername}
                        onChange={(e) => setLoginUsername(e.target.value)}
                        className="w-full pl-8 pr-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-white text-sm focus:outline-none focus:border-nude-300"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs text-nude-200 font-bold ml-1">Contraseña única</label>
                    <input
                      type="password"
                      required
                      placeholder="••••••••"
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-white text-sm focus:outline-none focus:border-nude-300"
                    />
                  </div>

                  {authError && (
                    <div className="p-2.5 rounded-xl bg-rose-950 border border-rose-400 text-xs text-rose-200 font-semibold">
                      ⚠️ {authError}
                    </div>
                  )}

                  <button type="submit" className="w-full py-3.5 rounded-xl nude-btn text-sm shadow-lg">
                    {authMode === "login" ? "Entrar a la Fiesta 🌅" : "Crear Perfil y Entrar ✨"}
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      }

      // ====================================================================
      // PANTALLA 2: COMPLETAR @USUARIO Y CONTRASEÑA TRAS GOOGLE LOGIN
      // ====================================================================
      if (!currentUserDoc) {
        const previewAvatar = setupAvatar || authSession.defaultAvatar;
        return (
          <div className="min-h-screen flex items-center justify-center p-6">
            <div className="glass-card rounded-3xl max-w-md w-full p-7 border border-nude-300/40 space-y-5 text-center">
              <h2 className="font-serif text-2xl font-bold text-white">Elige tu @Usuario Único</h2>
              <p className="text-xs text-nude-200">
                Tu correo <strong>jamás será visible</strong>. Crea tu <strong>@usuario</strong> y contraseña para tu perfil de la fiesta.
              </p>

              <form onSubmit={handleCompleteGoogleProfile} className="space-y-4 text-left">
                <div className="flex flex-col items-center">
                  <label className="cursor-pointer">
                    <img src={previewAvatar} alt="" className="w-24 h-24 rounded-full object-cover border-2 border-nude-300 mx-auto" />
                    <span className="mt-2 inline-block text-xs px-3 py-1 rounded-full nude-btn">
                      📷 Cambiar Foto de Perfil
                    </span>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={async (e) => {
                        const f = e.target.files?.[0];
                        if (f) setSetupAvatar(await compressSimpleImage(f));
                      }}
                      className="hidden"
                    />
                  </label>
                </div>

                <div>
                  <label className="text-xs font-bold text-nude-200 ml-1">Nombre de Usuario Único</label>
                  <div className="relative mt-1">
                    <span className="absolute left-3.5 top-3 text-nude-300 font-bold text-sm">@</span>
                    <input
                      type="text"
                      required
                      placeholder="ej. valentina_sunset"
                      value={setupUsername}
                      onChange={(e) => setSetupUsername(e.target.value)}
                      className="w-full pl-8 pr-4 py-3 rounded-xl bg-burgundy-950 border border-nude-300/40 text-white text-sm focus:outline-none"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-xs font-bold text-nude-200 ml-1">Crea tu Contraseña Única</label>
                  <input
                    type="password"
                    required
                    placeholder="Mínimo 4 caracteres"
                    value={setupPassword}
                    onChange={(e) => setSetupPassword(e.target.value)}
                    className="w-full mt-1 px-4 py-3 rounded-xl bg-burgundy-950 border border-nude-300/40 text-white text-sm focus:outline-none"
                  />
                </div>

                {setupError && (
                  <div className="p-3 rounded-xl bg-rose-950 border border-rose-400 text-xs text-rose-200 font-semibold">
                    ⚠️ {setupError}
                  </div>
                )}

                <button type="submit" className="w-full py-3.5 rounded-xl nude-btn text-sm shadow-lg">
                  Confirmar y Entrar al Sunset ✨
                </button>
              </form>
            </div>
          </div>
        );
      }

      const groupMessages = messages.filter(m => m.chatKey === "GLOBAL_GROUP");
      const activePrivateChatKey = activeChatFriend
        ? [currentUserDoc.uid, activeChatFriend.uid].sort().join("__")
        : null;
      const privateMessages = messages.filter(m => m.chatKey === activePrivateChatKey);

      const viewedProfileUser = viewedProfileUid ? users.find(u => u.uid === viewedProfileUid) : null;
      const viewedUserPosts = viewedProfileUser ? posts.filter(p => p.userId === viewedProfileUser.uid) : [];
      const viewedUserStories = viewedProfileUser ? stories.filter(s => s.userId === viewedProfileUser.uid) : [];
      const fullscreenPost = fullscreenPostId ? posts.find(p => p.id === fullscreenPostId) : null;

      const activeStoryGroup = storyViewer.open ? storyGroups[storyViewer.groupIndex] : null;
      const activeStoryItem = activeStoryGroup ? activeStoryGroup.items[storyViewer.storyIndex] : null;

      return (
        <div className="min-h-screen pb-24 max-w-lg mx-auto relative">

          {/* NOTIFICACIÓN EN VIVO DENTRO DE LA APP (TOAST) */}
          {inAppToast && (
            <div
              onClick={inAppToast.action}
              className="fixed top-4 left-1/2 z-50 w-[92%] max-w-md cursor-pointer toast-enter light-surface rounded-2xl p-3.5 shadow-2xl border-2 border-burgundy-800 flex items-center justify-between"
            >
              <div className="flex items-center gap-3">
                <span className="text-2xl">{inAppToast.icon}</span>
                <div>
                  <p className="text-xs font-extrabold text-[#090105]">{inAppToast.title}</p>
                  <p className="text-xs text-[#2E071B] truncate max-w-[230px] font-semibold">{inAppToast.text}</p>
                </div>
              </div>
              <span className="text-[11px] font-extrabold px-2.5 py-1 rounded-full bg-burgundy-900 text-white">
                Abrir
              </span>
            </div>
          )}

          {/* BARRA SUPERIOR CON LA CAMPANITA DE NOTIFICACIONES (🔔) */}
          <header className="sticky top-0 z-30 glass-nav px-4 py-3 flex items-center justify-between border-b border-nude-300/25">
            <div
              onClick={() => { setViewedProfileUid(null); setActiveTab("feed"); }}
              className="flex items-center gap-2.5 cursor-pointer"
            >
              <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-burgundy-800 via-rose-500 to-amber-300 p-0.5 flex items-center justify-center">
                <span className="text-lg">🌅</span>
              </div>
              <div>
                <h1 className="font-serif text-lg font-bold leading-none text-white">Sunset Vibes</h1>
                <div className="flex items-center gap-1.5 mt-0.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-[10px] text-nude-300 font-bold tracking-wider">
                    @{currentUserDoc.username} {isAdmin && "👑"}
                  </span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              {/* CAMPANITA DE NOTIFICACIONES (🔔) */}
              <button
                onClick={handleOpenBellModal}
                className="relative w-9 h-9 rounded-full bg-burgundy-800 border border-nude-300/40 flex items-center justify-center text-base shadow"
                title="Notificaciones"
              >
                <span>🔔</span>
                {unreadBellCount > 0 && (
                  <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-extrabold flex items-center justify-center animate-bounce">
                    {unreadBellCount}
                  </span>
                )}
              </button>

              <button
                onClick={() => setQrModalOpen(true)}
                className="px-3 py-1.5 rounded-full nude-btn text-xs shadow"
              >
                QR
              </button>
              <button
                onClick={handleLogout}
                className="px-2.5 py-1.5 rounded-full bg-burgundy-900 border border-nude-300/30 text-xs text-white font-semibold"
              >
                Salir
              </button>
            </div>
          </header>

          {/* ========================================================== */}
          {/* PESTAÑA 1: MURO PRINCIPAL + BURBUJA OVALADA DE HISTORIAS   */}
          {/* ========================================================== */}
          {activeTab === "feed" && !viewedProfileUser && (
            <div className="p-4 space-y-5">
              {/* BURBUJA OVALADA DE ALTO CONTRASTE DETRÁS DE LAS HISTORIAS */}
              <div className="stories-oval-bubble rounded-full px-5 py-3.5 flex items-center gap-3.5 overflow-x-auto no-scrollbar">
                <button
                  onClick={() => {
                    resetUploadStudio();
                    setUploadModal({ open: true, type: "story", withChallenge: false });
                  }}
                  className="flex flex-col items-center shrink-0"
                >
                  <div className="w-[60px] h-[60px] rounded-full bg-burgundy-950 border-2 border-dashed border-nude-300 flex items-center justify-center text-2xl text-nude-300 shadow-lg">
                    +
                  </div>
                  <span className="text-[10px] mt-1 text-nude-100 font-extrabold">Subir Story</span>
                </button>

                {storyGroups.map((group, gIdx) => {
                  const authorObj = users.find(u => u.uid === group.userId);
                  const online = isUserOnline(authorObj);
                  return (
                    <button
                      key={group.userId}
                      onClick={() => {
                        setUnreadStoriesCount(0);
                        setStoryMenuOpen(false);
                        setStoryViewer({ open: true, groupIndex: gIdx, storyIndex: 0, paused: false, progress: 0 });
                      }}
                      className="flex flex-col items-center shrink-0 relative"
                    >
                      <div className="w-[60px] h-[60px] rounded-full p-[2.5px] bg-gradient-to-tr from-amber-300 via-rose-500 to-nude-200 relative shadow-lg">
                        <img
                          src={group.userAvatar}
                          alt={group.userName}
                          className="w-full h-full object-cover rounded-full border-2 border-burgundy-950"
                        />
                        {group.items.length > 1 && (
                          <span className="absolute -top-1 -right-1 px-1.5 py-0.2 rounded-full bg-nude-300 text-[#090105] font-extrabold text-[9px] border border-burgundy-950">
                            {group.items.length}
                          </span>
                        )}
                        <span
                          className={`absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-burgundy-950 ${
                            online ? "bg-emerald-500" : "bg-red-500"
                          }`}
                        ></span>
                      </div>
                      <span className="text-[10px] mt-1 text-white font-bold truncate max-w-[68px]">
                        @{group.userName}
                      </span>
                    </button>
                  );
                })}
              </div>

              {/* Sección de 10 Retos Secuenciales (1 al 10 y vuelve al 1) */}
              <div className="glass-card rounded-2xl p-4 border border-nude-300/40">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-[10px] uppercase tracking-widest px-2.5 py-0.5 rounded-full nude-btn">
                    Reto {challengeIndex + 1} de {PHOTO_CHALLENGES.length}
                  </span>
                  <button
                    onClick={nextSequentialChallenge}
                    className="text-xs text-nude-200 font-bold underline hover:text-white"
                  >
                    ⏭️ Siguiente reto ({((challengeIndex + 1) % PHOTO_CHALLENGES.length) + 1}/{PHOTO_CHALLENGES.length})
                  </button>
                </div>

                <h3 className="text-base font-bold text-white flex items-center gap-2 mt-1">
                  <span className="text-xl">{currentChallenge.emoji}</span>
                  {currentChallenge.title}
                </h3>
                <p className="text-xs text-nude-100 mt-1 mb-3">{currentChallenge.desc}</p>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => {
                      resetUploadStudio();
                      setUploadModal({ open: true, type: "post", withChallenge: true });
                    }}
                    className="py-2.5 px-3 rounded-xl nude-btn text-xs shadow"
                  >
                    📸 Subir con este Reto
                  </button>
                  <button
                    onClick={() => {
                      resetUploadStudio();
                      setUploadModal({ open: true, type: "post", withChallenge: false });
                    }}
                    className="py-2.5 px-3 rounded-xl bg-burgundy-800 border border-nude-300/40 text-white font-bold text-xs"
                  >
                    ✨ Subir Libre
                  </button>
                </div>
              </div>

              {/* Feed Principal */}
              {posts.length === 0 ? (
                <div className="glass-card rounded-3xl p-8 text-center">
                  <p className="text-3xl mb-2">🌅</p>
                  <p className="text-base font-bold text-white">¡Sé el primero en inaugurar el muro!</p>
                  <p className="text-xs text-nude-200 mt-1">Sube una foto o video Full HD de 15s con filtros y stickers.</p>
                </div>
              ) : (
                posts.map((post) => {
                  const isLiked = (post.likes || []).includes(currentUserDoc.uid);
                  const canManage = post.userId === currentUserDoc.uid || isAdmin;
                  const authorObj = users.find(u => u.uid === post.userId);
                  const online = isUserOnline(authorObj);
                  const cropObj = CROP_RATIOS.find(c => c.id === post.cropId) || CROP_RATIOS[0];
                  const postReactions = post.reactions || {};

                  return (
                    <div key={post.id} className="glass-card rounded-3xl overflow-hidden">
                      <div className="p-3.5 flex items-center justify-between">
                        <button
                          onClick={() => openUserProfile(post.userId)}
                          className="flex items-center gap-2.5 text-left group"
                        >
                          <div className="relative">
                            <img src={authorObj?.avatar || post.userAvatar} alt="" className="w-10 h-10 rounded-full object-cover border border-nude-300/50" />
                            <span
                              className={`absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-burgundy-950 ${
                                online ? "bg-emerald-500" : "bg-red-500"
                              }`}
                            ></span>
                          </div>
                          <div>
                            <p className="text-sm font-bold text-white group-hover:text-nude-300 transition">
                              @{authorObj?.username || post.userName}
                            </p>
                            {post.challengeTitle && (
                              <span className="inline-block text-[10px] text-amber-300 font-semibold">
                                Reto: {post.challengeTitle}
                              </span>
                            )}
                          </div>
                        </button>

                        {canManage && (
                          <div className="flex items-center gap-1.5">
                            <button
                              onClick={() => setAdminEditPost({ ...post })}
                              className="text-xs text-nude-200 hover:text-white px-2.5 py-1 rounded-lg bg-burgundy-900 border border-nude-300/25"
                            >
                              ✏️
                            </button>
                            <button
                              onClick={() => handleDeletePost(post)}
                              className="text-xs text-rose-300 hover:text-rose-100 px-2.5 py-1 rounded-lg bg-burgundy-950"
                            >
                              🗑️
                            </button>
                          </div>
                        )}
                      </div>

                      <div className="bg-black flex items-center justify-center overflow-hidden">
                        <MediaRenderer
                          item={post}
                          className={`w-full ${cropObj.class} cursor-pointer`}
                          onDoubleClick={() => toggleLike(post)}
                        />
                      </div>

                      <div className="p-4 space-y-2.5">
                        <div className="flex items-center justify-between flex-wrap gap-2">
                          <div className="flex items-center gap-2">
                            <button
                              onClick={() => toggleLike(post)}
                              className={`flex items-center gap-1.5 text-xs font-extrabold px-3.5 py-1.5 rounded-full transition ${
                                isLiked ? "bg-rose-500 text-white" : "light-surface"
                              }`}
                            >
                              <span>{isLiked ? "❤️" : "🤍"}</span>
                              <span>{post.likes?.length || 0}</span>
                            </button>

                            <button
                              onClick={() => setFullscreenPostId(post.id)}
                              className="flex items-center gap-1.5 text-xs font-bold px-3.5 py-1.5 rounded-full bg-burgundy-900 border border-nude-300/35 text-nude-100"
                            >
                              <span>💬</span>
                              <span>{post.comments?.length || 0}</span>
                            </button>

                            <button
                              onClick={() => setShareModalPost(post)}
                              className="flex items-center gap-1.5 text-xs font-extrabold px-3.5 py-1.5 rounded-full nude-btn shadow"
                            >
                              <span>📤</span>
                              <span>Compartir</span>
                            </button>
                          </div>

                          <div className="flex items-center gap-1">
                            {REACTION_EMOJIS.map((emo) => {
                              const arr = Array.isArray(postReactions[emo]) ? postReactions[emo] : [];
                              const iReacted = arr.includes(currentUserDoc.uid);
                              return (
                                <button
                                  key={emo}
                                  onClick={() => toggleReaction(post, emo)}
                                  className={`px-2 py-1 rounded-full text-xs font-extrabold flex items-center gap-1 border transition ${
                                    iReacted
                                      ? "bg-amber-300 text-[#090105] border-amber-200 scale-105"
                                      : "bg-burgundy-900 text-white border-nude-300/25 hover:bg-burgundy-800"
                                  }`}
                                >
                                  <span>{emo}</span>
                                  {arr.length > 0 && <span className="text-[11px]">{arr.length}</span>}
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        {post.caption && (
                          <p className="text-sm text-white">
                            <button
                              onClick={() => openUserProfile(post.userId)}
                              className="font-bold text-nude-300 mr-1.5 hover:underline"
                            >
                              @{authorObj?.username || post.userName}:
                            </button>
                            {post.caption}
                          </p>
                        )}

                        {(post.comments || []).length > 0 && (
                          <div className="space-y-1.5 pt-2 border-t border-nude-300/20 max-h-36 overflow-y-auto no-scrollbar">
                            {post.comments.map((c) => {
                              const canDelComment = c.userId === currentUserDoc.uid || post.userId === currentUserDoc.uid || isAdmin;
                              return (
                                <div key={c.id} className="flex items-center justify-between text-xs text-nude-100 gap-2">
                                  <p>
                                    <button
                                      onClick={() => openUserProfile(c.userId)}
                                      className="font-bold text-white mr-1.5 hover:underline"
                                    >
                                      @{c.userName}:
                                    </button>
                                    {c.text}
                                  </p>
                                  {canDelComment && (
                                    <button
                                      onClick={() => handleDeleteComment(post, c)}
                                      className="text-[10px] text-rose-300 hover:text-rose-100 shrink-0"
                                    >
                                      ✕
                                    </button>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}

                        <div className="flex items-center gap-2 pt-1">
                          <input
                            type="text"
                            placeholder="Escribe un comentario..."
                            value={commentInputs[post.id] || ""}
                            onChange={(e) => setCommentInputs(prev => ({ ...prev, [post.id]: e.target.value }))}
                            onKeyDown={(e) => e.key === "Enter" && handleAddComment(post.id)}
                            className="flex-1 px-3.5 py-2 rounded-full bg-burgundy-950 border border-nude-300/35 text-xs text-white placeholder-nude-300/50 focus:outline-none"
                          />
                          <button
                            onClick={() => handleAddComment(post.id)}
                            className="px-4 py-2 rounded-full nude-btn text-xs"
                          >
                            Comentar
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {/* ========================================================== */}
          {/* PESTAÑA 2: BUSCADOR DE INVITADOS, SOLICITUDES Y MATCH 🔥    */}
          {/* ========================================================== */}
          {activeTab === "search" && !viewedProfileUser && (
            <div className="p-4 space-y-4">
              <div className="glass-card rounded-3xl p-4 space-y-3">
                <h2 className="font-serif text-xl font-bold text-white">Buscar Invitados (@)</h2>
                <p className="text-xs text-nude-200">
                  Encuentra a cualquier invitado, envíale solicitud de amistad o entra a su perfil para darle un <strong>Fuego de Match 🔥</strong>.
                </p>
                <div className="relative">
                  <span className="absolute left-3.5 top-3 text-nude-300 font-bold text-sm">@</span>
                  <input
                    type="text"
                    placeholder="Buscar @usuario..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-8 pr-4 py-2.5 rounded-2xl bg-burgundy-950 border border-nude-300/40 text-sm text-white focus:outline-none"
                  />
                </div>
              </div>

              <div className="space-y-2.5">
                {filteredSearchUsers.map((guest) => {
                  const online = isUserOnline(guest);
                  const isMe = guest.uid === currentUserDoc.uid;
                  const relStatus = getRelationshipStatus(guest);
                  const guestPostsCount = posts.filter(p => p.userId === guest.uid).length;

                  return (
                    <div
                      key={guest.uid}
                      className="glass-card rounded-2xl p-3.5 flex items-center justify-between"
                    >
                      <button
                        onClick={() => openUserProfile(guest.uid)}
                        className="flex items-center gap-3 text-left"
                      >
                        <div className="relative">
                          <img src={guest.avatar} alt="" className="w-12 h-12 rounded-full object-cover border border-nude-300/50" />
                          <span
                            className={`absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-burgundy-950 ${
                              online ? "bg-emerald-500" : "bg-red-500"
