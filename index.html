    const uploadToSingleCloudinaryAccount = (account, fileOrDataUrl, resourceType = "auto", onProgress = null) => {
      return new Promise((resolve, reject) => {
        const url = `https://api.cloudinary.com/v1_1/${account.cloudName}/${resourceType}/upload`;
        const xhr = new XMLHttpRequest();
        const formData = new FormData();
        formData.append("file", fileOrDataUrl);
        formData.append("upload_preset", account.uploadPreset);

        xhr.open("POST", url, true);

        if (xhr.upload && onProgress) {
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              const pct = Math.round((e.loaded / e.total) * 100);
              onProgress(pct);
            }
          };
        }

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            const response = JSON.parse(xhr.responseText);
            const optimizedUrl = response.secure_url
              ? response.secure_url.replace("/upload/", "/upload/q_auto:best,f_auto/")
              : response.secure_url;
            resolve(optimizedUrl);
          } else {
            let errMsg = `Error en cuenta ${account.cloudName}`;
            try {
              const errJson = JSON.parse(xhr.responseText);
              if (errJson?.error?.message) errMsg = `${account.cloudName}: ${errJson.error.message}`;
            } catch (e) {}
            reject(new Error(errMsg));
          }
        };

        xhr.onerror = () => reject(new Error(`Error de red con ${account.cloudName}`));
        xhr.send(formData);
      });
    };

    // Balanceador entre las 4 cuentas con respaldo automático
    const uploadToCloudinary = async (fileOrDataUrl, resourceType = "auto", onProgress = null) => {
      const shuffledPool = [...CLOUDINARY_ACCOUNTS].sort(() => Math.random() - 0.5);

      let lastErr = null;
      for (const acc of shuffledPool) {
        if (!acc || !acc.cloudName) continue;
        try {
          return await uploadToSingleCloudinaryAccount(acc, fileOrDataUrl, resourceType, onProgress);
        } catch (err) {
          console.warn("Saltando a la siguiente cuenta de Cloudinary...", err.message);
          lastErr = err;
        }

    const bakeEditedImage = (rawDataUrl, { filterCss, cropRatio, overlayText, textColorObj, textYPos, stickers = [], maxDim = 1920, quality = 0.92 }) => {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = rawDataUrl;
        img.onload = () => {
          let srcX = 0, srcY = 0, srcW = img.width, srcH = img.height;

          if (cropRatio) {
            const currentRatio = srcW / srcH;
            if (currentRatio > cropRatio) {
              srcW = srcH * cropRatio;
              srcX = (img.width - srcW) / 2;
            } else {
              srcH = srcW / cropRatio;
              srcY = (img.height - srcH) / 2;
            }
          }

          let outW = srcW, outH = srcH;
          if (outW > maxDim) { outH = Math.round((outH * maxDim) / outW); outW = maxDim; }
          if (outH > maxDim) { outW = Math.round((outW * maxDim) / outH); outH = maxDim; }

          const canvas = document.createElement("canvas");
          canvas.width = outW;
          canvas.height = outH;
          const ctx = canvas.getContext("2d");

          if (filterCss && filterCss !== "none") {
            ctx.filter = filterCss;
          }
          ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
          ctx.filter = "none";

          if (Array.isArray(stickers) && stickers.length > 0) {
            const stickerSize = Math.round(outW * 0.12);
            ctx.font = `${stickerSize}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            stickers.forEach((st) => {
              const sx = (st.x / 100) * outW;
              const sy = (st.y / 100) * outH;
              ctx.fillText(st.emoji, sx, sy);
            });
          }

          if (overlayText && overlayText.trim()) {
            const fontSize = Math.max(22, Math.round(outW * 0.048));
            ctx.font = `800 ${fontSize}px "Plus Jakarta Sans", sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const yCoord = Math.round((textYPos / 100) * outH);
            const textStr = overlayText.trim();
            const metrics = ctx.measureText(textStr);
            const padX = Math.round(outW * 0.03), padY = Math.round(outW * 0.018);
            const boxW = Math.min(outW - 24, metrics.width + padX * 2);
            const boxH = fontSize + padY * 2;

            ctx.fillStyle = textColorObj?.bg || "rgba(9, 1, 5, 0.75)";
            ctx.beginPath();
            ctx.roundRect((outW - boxW) / 2, yCoord - boxH / 2, boxW, boxH, 16);
            ctx.fill();

            ctx.fillStyle = textColorObj?.hex || "#FFFFFF";
            ctx.fillText(textStr, outW / 2, yCoord, outW - 40);
          }

          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = (e) => reject(e);
      });
    };

    const cropImageByBorders = (imageUrl, { top = 0, bottom = 0, left = 0, right = 0 }) => {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = imageUrl;
        img.onload = () => {
          const sx = Math.round((left / 100) * img.width);
          const sy = Math.round((top / 100) * img.height);
          const sw = Math.max(40, Math.round(((100 - left - right) / 100) * img.width));
          const sh = Math.max(40, Math.round(((100 - top - bottom) / 100) * img.height));

          const canvas = document.createElement("canvas");
          canvas.width = sw;
          canvas.height = sh;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
          resolve(canvas.toDataURL("image/jpeg", 0.92));
        };
        img.onerror = reject;
      });
    };

    const compressSimpleImage = (file, maxWidth = 600, quality = 0.86) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (ev) => {
          const img = new Image();
          img.src = ev.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    };

    const validateVideoFile = (file) => {
      return new Promise((resolve, reject) => {
        if (file.size > 100 * 1024 * 1024) {
          reject(new Error("El video supera los 100 MB. Graba un clip de máximo 15 segundos."));
          return;
        }
        const video = document.createElement("video");
        video.preload = "metadata";
        const objUrl = URL.createObjectURL(file);
        video.onloadedmetadata = () => {
          if (video.duration > 15.8) {
            URL.revokeObjectURL(objUrl);
            reject(new Error(`El video dura ${Math.round(video.duration)} segundos. El máximo permitido es de 15 segundos.`));
            return;
          }
          resolve({ previewUrl: objUrl, file, duration: Math.round(video.duration) });
        };
        video.onerror = () => {
          URL.revokeObjectURL(objUrl);
          reject(new Error("Formato de video no compatible."));
        };
        video.src = objUrl;
      });
    };

    function MediaRenderer({ item, className = "w-full object-cover", onDoubleClick, autoPlay = false, controls = true, paused = false }) {

          videoRef.current.pause();
        } else if (autoPlay) {

            <video
              ref={videoRef}
              src={item.mediaUrl}
              controls={controls}
              autoPlay={autoPlay && !paused}
              playsInline
              style={{ filter: filterObj.css }}
              className={className}
            />
            {stickersList.map((st) => (

                key={st.id}

              >
                {item.overlayText}
              </div>
            )}
          </div>
        );
      }

      return (
        <img
          src={item.mediaUrl}
          alt={item.caption || "Sunset Vibes"}
          onDoubleClick={onDoubleClick}
          className={className}
        />
      );
    }

      // Escuchar Firebase en vivo (incluyendo la nueva colección notifications)
      useEffect(() => {

        const unsubStories = onSnapshot(query(collection(db, "stories"), orderBy("createdAt", "asc")), (snap) => {
          setStories(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        const unsubMessages = onSnapshot(query(collection(db, "messages"), orderBy("createdAt", "asc")), (snap) => {
          setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        const unsubNotifs = onSnapshot(query(collection(db, "notifications"), orderBy("createdAt", "desc")), (snap) => {
          setNotifications(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });

        return () => {
          unsubAuth(); unsubUsers(); unsubPosts(); unsubStories(); unsubMessages(); unsubNotifs();
        };
      }, [fbReady]);

      const currentUserDoc = useMemo(() => {
        if (!authSession) return null;
        return users.find(u => u.uid === authSession.uid && u.username) || null;
      }, [users, authSession]);

      const isAdmin = useMemo(() => {
        const emailToCheck = (currentUserDoc?.email || authSession?.email || "").toLowerCase();
        return emailToCheck === ADMIN_EMAIL;
      }, [currentUserDoc, authSession]);

      // Mis notificaciones recibidas en la campanita
      const myNotifications = useMemo(() => {
        if (!currentUserDoc) return [];
        return notifications.filter(n => n.toUid === currentUserDoc.uid);
      }, [notifications, currentUserDoc]);

      const unreadBellCount = useMemo(() => {
        return myNotifications.filter(n => !n.read).length;
      }, [myNotifications]);

      // Mis Matches recibidos (para la Cajita Secreta de Matches en Mi Perfil)
      const myReceivedMatches = useMemo(() => {
        if (!currentUserDoc) return [];
        return Array.isArray(currentUserDoc.matchesReceived) ? [...currentUserDoc.matchesReceived].reverse() : [];
      }, [currentUserDoc]);

      // Carta de Match pendiente que se muestra automáticamente cuando el dueño entra a su Perfil
      const pendingMatchCard = useMemo(() => {
        if (!currentUserDoc) return null;
        const list = Array.isArray(currentUserDoc.matchesReceived) ? currentUserDoc.matchesReceived : [];
        return list.find(m => m.status === "pending") || null;
      }, [currentUserDoc]);

      // Función auxiliar para enviar notificaciones a la campanita de cualquier usuario
      const sendNotification = async ({ toUid, type, text, postId = null, storyUserId = null, status = null }) => {
        if (!currentUserDoc || !window.FB || !toUid || toUid === currentUserDoc.uid) return;
        const { db, collection, addDoc } = window.FB;
        try {
          await addDoc(collection(db, "notifications"), {
            toUid,
            fromUid: currentUserDoc.uid,
            fromUsername: currentUserDoc.username,
            fromAvatar: currentUserDoc.avatar,
            type, // 'friend_request' | 'friend_accepted' | 'match_received' | 'match_accepted' | 'friend_post' | 'friend_story' | 'like' | 'comment' | 'reaction'
            text,
            postId,
            storyUserId,
            status: status || "info", // 'pending' | 'accepted' | 'denied' | 'info'
            read: false,
            createdAt: Date.now()
          });
        } catch (e) {}
      };

      // Marcar notificaciones como leídas al abrir la campanita
      const handleOpenBellModal = async () => {
        setNotifModalOpen(true);
        if (!currentUserDoc || !window.FB) return;
        const { db, doc, updateDoc } = window.FB;
        myNotifications.filter(n => !n.read).forEach(n => {
          updateDoc(doc(db, "notifications", n.id), { read: true }).catch(() => {});
        });
      };

      // Agrupar Historias por Persona
      const storyGroups = useMemo(() => {
        const map = new Map();
        stories.forEach((st) => {
          if (!map.has(st.userId)) {
            const uObj = users.find(u => u.uid === st.userId);
            map.set(st.userId, {
              userId: st.userId,
              userName: uObj?.username || st.userName,
              userAvatar: uObj?.avatar || st.userAvatar,
              items: []
            });
          }
          map.get(st.userId).items.push(st);
        });
        return Array.from(map.values());
      }, [stories, users]);

      // Temporizador de Historias con Pausa Real
      useEffect(() => {
        if (!storyViewer.open) return;
        const currentGroup = storyGroups[storyViewer.groupIndex];
        if (!currentGroup) return;
        const currentStory = currentGroup.items[storyViewer.storyIndex];
        if (!currentStory) return;

        const durationMs = currentStory.mediaType === "video"
          ? Math.max(5000, (currentStory.videoDuration || 8) * 1000)
          : 5000;

        const stepMs = 50;
        const increment = (stepMs / durationMs) * 100;

        const timer = setInterval(() => {
          if (storyPausedRef.current) return;
          setStoryViewer((prev) => {
            if (!prev.open || storyPausedRef.current) return prev;
            if (prev.progress + increment >= 100) {
              const grp = storyGroups[prev.groupIndex];
              if (grp && prev.storyIndex < grp.items.length - 1) {
                return { ...prev, storyIndex: prev.storyIndex + 1, progress: 0 };
              } else if (prev.groupIndex < storyGroups.length - 1) {
                return { ...prev, groupIndex: prev.groupIndex + 1, storyIndex: 0, progress: 0 };
              } else {
                return { open: false, groupIndex: 0, storyIndex: 0, paused: false, progress: 0 };
              }
            }
            return { ...prev, progress: prev.progress + increment };
          });
        }, stepMs);

        return () => clearInterval(timer);
      }, [storyViewer.open, storyViewer.groupIndex, storyViewer.storyIndex, storyGroups]);

      const goNextStory = () => {
        setStoryMenuOpen(false);
        setStoryViewer((prev) => {
          const grp = storyGroups[prev.groupIndex];
          if (!grp) return { ...prev, open: false };
          if (prev.storyIndex < grp.items.length - 1) {
            return { ...prev, storyIndex: prev.storyIndex + 1, progress: 0 };
          } else if (prev.groupIndex < storyGroups.length - 1) {
            return { ...prev, groupIndex: prev.groupIndex + 1, storyIndex: 0, progress: 0 };
          } else {
            return { open: false, groupIndex: 0, storyIndex: 0, paused: false, progress: 0 };
          }
        });
      };

      const goPrevStory = () => {
        setStoryMenuOpen(false);
        setStoryViewer((prev) => {
          if (prev.storyIndex > 0) {
            return { ...prev, storyIndex: prev.storyIndex - 1, progress: 0 };
          } else if (prev.groupIndex > 0) {
            const prevGrp = storyGroups[prev.groupIndex - 1];
            return {
              ...prev,
              groupIndex: prev.groupIndex - 1,
              storyIndex: Math.max(0, (prevGrp?.items?.length || 1) - 1),
              progress: 0
            };
          } else {
            return { ...prev, storyIndex: 0, progress: 0 };
          }
        });
      };

      const goNextPersonStories = () => {
        setStoryMenuOpen(false);
        setStoryViewer((prev) => {
          if (prev.groupIndex < storyGroups.length - 1) {
            return { ...prev, groupIndex: prev.groupIndex + 1, storyIndex: 0, progress: 0 };
          }
          return { open: false, groupIndex: 0, storyIndex: 0, paused: false, progress: 0 };
        });
      };

      const goPrevPersonStories = () => {
        setStoryMenuOpen(false);
        setStoryViewer((prev) => {
          if (prev.groupIndex > 0) {
            return { ...prev, groupIndex: prev.groupIndex - 1, storyIndex: 0, progress: 0 };
          }
          return { ...prev, storyIndex: 0, progress: 0 };
        });
      };

      const openStoriesForUser = (uid) => {
        const gIdx = storyGroups.findIndex(g => g.userId === uid);
        if (gIdx !== -1) {
          setStoryMenuOpen(false);
          setStoryViewer({ open: true, groupIndex: gIdx, storyIndex: 0, paused: false, progress: 0 });
        }
      };

      const handleSendStoryReply = async (e, storyGroup, storyItem) => {
        e.preventDefault();
        if (!storyReplyText.trim() || !currentUserDoc || !window.FB) return;
        const { db, collection, addDoc } = window.FB;
        const chatKey = [currentUserDoc.uid, storyGroup.userId].sort().join("__");

        try {
          await addDoc(collection(db, "messages"), {
            chatKey,
            senderId: currentUserDoc.uid,
            senderName: currentUserDoc.username,
            senderAvatar: currentUserDoc.avatar,
            receiverId: storyGroup.userId,
            text: `Respondió a tu historia: "${storyReplyText.trim()}"`,

            sharedMediaType: storyItem.mediaType || "image",
            createdAt: Date.now()
          });
          setStoryReplyText("");
          setStoryInputFocused(false);
          setInAppToast({
            id: Date.now(),
            icon: "✅",
            title: `Respuesta enviada a @${storyGroup.userName}`,

            action: () => {

              if (friendObj) {
                setViewedProfileUid(null);
                setActiveTab("chat");
                setChatSubTab("private");
                setActiveChatFriend(friendObj);
              }
              setInAppToast(null);
            }
          });
        } catch (err) {}
      };

      const handleDownloadMedia = (mediaUrl, type = "image") => {
        const link = document.createElement("a");
        link.href = mediaUrl;
        link.target = "_blank";
        link.download = `sunset-vibes-${Date.now()}.${type === "video" ? "mp4" : "jpg"}`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setStoryMenuOpen(false);
      };

      // Latido Online
      useEffect(() => {
        if (!currentUserDoc || !window.FB) return;

        const ref = doc(db, "users", currentUserDoc.uid);
        const beat = () => updateDoc(ref, { isOnline: true, lastSeen: Date.now() }).catch(() => {});
        const off = () => updateDoc(ref, { isOnline: false, lastSeen: Date.now() }).catch(() => {});
        beat();
        const intv = setInterval(beat, 35000);
        window.addEventListener("beforeunload", off);
        return () => {
          clearInterval(intv);
          window.removeEventListener("beforeunload", off);
        };
      }, [currentUserDoc?.uid]);

      // Notificaciones flotantes en vivo para Mensajes y Campanita
      useEffect(() => {
        if (!currentUserDoc) return;
        if (prevMessagesLenRef.current !== null && messages.length > prevMessagesLenRef.current) {
          const newest = messages[messages.length - 1];

          if (newest.senderId !== currentUserDoc.uid && isForMe) {
            setInAppToast({
              id: Date.now(),

                  if (senderObj) {

                }
                setInAppToast(null);

            setInAppToast({

              icon: newest.type?.includes("match") ? "🔥" : "🔔",

          setViewedProfileUid(uid);
        }
