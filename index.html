                          <input type="text" placeholder="Escribe el texto (arrástralo con el dedo)..." value={overlayText} onChange={(e) => setOverlayText(e.target.value)} className="w-full px-3 py-2 rounded-xl bg-burgundy-900 border border-nude-300/30 text-xs text-white" />
                          <div className="flex items-center justify-between gap-2 flex-wrap">
                            <div className="flex gap-1.5">
                              {TEXT_COLORS.map(tc => (
                                <button type="button" key={tc.id} onClick={() => setOverlayColor(tc)} style={{ backgroundColor: tc.hex }} className={`w-6 h-6 rounded-full border-2 ${overlayColor.id === tc.id ? "border-amber-400 scale-110" : "border-white/30"}`}></button>
                              ))}
                            </div>
                            <div className="flex items-center gap-1">
                              <span className="text-[10px] text-nude-200 font-bold">Zoom:</span>
                              <button type="button" onClick={() => setOverlayScale(Math.max(0.5, overlayScale - 0.2))} className="px-2 py-0.5 rounded bg-burgundy-900 text-xs font-bold">➖</button>
                              <span className="text-xs font-extrabold text-amber-300">{Math.round(overlayScale * 100)}%</span>
                              <button type="button" onClick={() => setOverlayScale(Math.min(2.2, overlayScale + 0.2))} className="px-2 py-0.5 rounded bg-burgundy-900 text-xs font-bold">➕</button>
                            </div>
                            <div className="flex items-center gap-1">
                              <span className="text-[10px] text-nude-200 font-bold">Giro:</span>
                              <button type="button" onClick={() => setOverlayRotation((overlayRotation - 15) % 360)} className="px-2 py-0.5 rounded bg-burgundy-900 text-xs font-bold">↺</button>
                              <span className="text-xs font-extrabold text-amber-300">{overlayRotation}°</span>
                              <button type="button" onClick={() => setOverlayRotation((overlayRotation + 15) % 360)} className="px-2 py-0.5 rounded bg-burgundy-900 text-xs font-bold">↻</button>
                            </div>
                          </div>
                        </div>
                      )}

                      {activeStudioTool === "stickers" && (
                        <div className="bg-burgundy-950 p-3.5 rounded-2xl border border-nude-300/30 space-y-2">
                          <div className="flex items-center justify-between flex-wrap gap-2">
                            <p className="text-[11px] font-bold text-nude-200">Toca para agregar (arrástralos):</p>
                            {selectedStickerId && (
                              <div className="flex items-center gap-1 flex-wrap">
                                <span className="text-[10px] text-amber-300 font-bold">Escala:</span>
                                <button type="button" onClick={() => updateSelectedStickerScale(-0.2)} className="px-2 py-0.5 rounded bg-burgundy-900 text-xs font-bold">➖</button>
                                <button type="button" onClick={() => updateSelectedStickerScale(0.2)} className="px-2 py-0.5 rounded bg-burgundy-900 text-xs font-bold">➕</button>
                                <button type="button" onClick={() => updateSelectedStickerRotation(-15)} className="px-2 py-0.5 rounded bg-burgundy-900 text-xs font-bold">↺</button>
                                <button type="button" onClick={() => updateSelectedStickerRotation(15)} className="px-2 py-0.5 rounded bg-burgundy-900 text-xs font-bold">↻</button>
                                <button type="button" onClick={() => removeStickerFromCanvas(selectedStickerId)} className="px-2 py-0.5 rounded bg-rose-950 text-rose-200 text-xs font-bold">Borrar</button>
                              </div>
                            )}
                          </div>
                          <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                            {STICKERS.map(st => (
                              <button type="button" key={st} onClick={() => addStickerToCanvas(st)} className="text-lg px-2.5 py-1 rounded-lg bg-burgundy-900 shrink-0">+{st}</button>
                            ))}
                          </div>
                          <div className="flex flex-wrap gap-1 pt-1">
                            {VIP_STAMPS.map(st => (
                              <button type="button" key={st} onClick={() => addStickerToCanvas(st)} className="px-2 py-1 rounded-lg bg-burgundy-900 border border-amber-300/40 text-amber-300 font-bold text-[10px]">+{st}</button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {mediaError && <div className="p-3 rounded-xl bg-rose-950 border border-rose-400 text-xs text-rose-200 font-semibold">⚠️ {mediaError}</div>}

                  <div>
                    <input type="text" placeholder="Pie de foto (etiqueta amigos con @usuario)..." value={caption} onChange={(e) => setCaption(e.target.value)} className="w-full px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/35 text-xs text-white" />
                    <MentionAutocompleteBar value={caption} onChange={setCaption} users={users} label="Arrobar en pie de foto:" />
                  </div>

                  <button type="submit" disabled={!rawMediaUrl || isSubmitting} className="w-full py-3.5 rounded-xl nude-btn text-sm shadow-lg">{isSubmitting ? `Publicando (${uploadProgress}%)...` : "Publicar Ahora ✨"}</button>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* MODAL 3: RECORTAR BORDES DE PUBLICACIÓN YA SUBIDA (✂️ NO DESTRUCTIVO) */}
          {/* ========================================================== */}
          {cropModalPost && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md p-4 flex items-center justify-center overflow-y-auto">
              <div className="glass-card rounded-3xl max-w-md w-full p-5 border border-nude-300/40 space-y-4 my-auto">
                <div className="flex items-center justify-between">
                  <h3 className="font-serif text-xl font-bold text-white">✂️ Recortar Bordes</h3>
                  <button onClick={() => setCropModalPost(null)} className="text-nude-300 font-bold">✕</button>
                </div>

                <div className="relative w-full h-64 bg-black rounded-2xl overflow-hidden flex items-center justify-center border border-nude-300/30">
                  {cropModalPost.mediaType === "video" ? (
                    <video src={cropModalPost.mediaUrl} className="w-full h-full object-contain" muted autoPlay loop />
                  ) : (
                    <img src={cropModalPost.originalMediaUrl || cropModalPost.mediaUrl} alt="" className="w-full h-full object-contain" />
                  )}
                  <div
                    style={{
                      top: `${borderCrop.top}%`,
                      bottom: `${borderCrop.bottom}%`,
                      left: `${borderCrop.left}%`,
                      right: `${borderCrop.right}%`
                    }}
                    className="absolute border-2 border-amber-300 shadow-[0_0_0_9999px_rgba(0,0,0,0.72)] pointer-events-none rounded-lg"
                  ></div>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs bg-burgundy-950 p-3.5 rounded-2xl border border-nude-300/20">
                  <div><label className="font-bold text-nude-200">Arriba ({borderCrop.top}%)</label><input type="range" min="0" max="40" value={borderCrop.top} onChange={(e) => setBorderCrop({ ...borderCrop, top: Number(e.target.value) })} className="w-full accent-nude-300" /></div>
                  <div><label className="font-bold text-nude-200">Abajo ({borderCrop.bottom}%)</label><input type="range" min="0" max="40" value={borderCrop.bottom} onChange={(e) => setBorderCrop({ ...borderCrop, bottom: Number(e.target.value) })} className="w-full accent-nude-300" /></div>
                  <div><label className="font-bold text-nude-200">Izquierda ({borderCrop.left}%)</label><input type="range" min="0" max="40" value={borderCrop.left} onChange={(e) => setBorderCrop({ ...borderCrop, left: Number(e.target.value) })} className="w-full accent-nude-300" /></div>
                  <div><label className="font-bold text-nude-200">Derecha ({borderCrop.right}%)</label><input type="range" min="0" max="40" value={borderCrop.right} onChange={(e) => setBorderCrop({ ...borderCrop, right: Number(e.target.value) })} className="w-full accent-nude-300" /></div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => handleApplyBorderCrop(false)} disabled={isCroppingPost} className="py-3.5 rounded-xl nude-btn text-xs shadow-lg">
                    {isCroppingPost ? "Guardando..." : "Guardar Recorte ✨"}
                  </button>
                  <button onClick={() => handleApplyBorderCrop(true)} disabled={isCroppingPost} className="py-3.5 rounded-xl bg-burgundy-800 border border-nude-300/40 text-white font-bold text-xs shadow-lg">
                    💾 Guardar y Descargar (.JPG)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* MODAL 4: EDITAR MI PERFIL Y VIBE (✏️ REPARADO)             */}
          {/* ========================================================== */}
          {editProfileModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4 my-auto">
                <div className="flex items-center justify-between">
                  <h3 className="font-serif text-xl font-bold text-white">Editar Mi Perfil y Vibe</h3>
                  <button onClick={() => setEditProfileModal(false)} className="text-nude-300 font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveProfileEdit} className="space-y-3.5">
                  <div className="flex flex-col items-center">
                    <label className="cursor-pointer text-center">
                      <img src={newProfileAvatar || currentUserDoc.avatar} alt="" className="w-24 h-24 rounded-full object-cover mx-auto border-2 border-nude-300" />
                      <span className="mt-2 inline-block text-xs px-3 py-1 rounded-full nude-btn">📷 Cambiar Foto</span>
                      <input type="file" accept="image/*" onChange={async (e) => { const f = e.target.files?.[0]; if (f) setNewProfileAvatar(await compressSimpleImage(f)); }} className="hidden" />
                    </label>
                  </div>

                  <div>
                    <label className="text-xs text-nude-200 font-bold">Nombre de usuario</label>
                    <input type="text" required value={newProfileUsername} onChange={(e) => setNewProfileUsername(e.target.value)} className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-sm text-white" />
                  </div>

                  <div>
                    <label className="text-xs text-nude-200 font-bold">Tu Etiqueta de Vibe</label>
                    <select value={newProfileVibe} onChange={(e) => setNewProfileVibe(e.target.value)} className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-xs text-white">
                      {VIBE_STATUS_LIST.map(v => <option key={v} value={v}>{v}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="text-xs text-nude-200 font-bold">Nueva contraseña (opcional)</label>
                    <input type="password" placeholder="Contraseña" value={newProfilePassword} onChange={(e) => setNewProfilePassword(e.target.value)} className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-sm text-white" />
                  </div>

                  {profileEditError && <p className="text-xs text-rose-300 font-bold">{profileEditError}</p>}

                  <button type="submit" className="w-full py-3 rounded-xl nude-btn text-xs shadow">Guardar Cambios ✨</button>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* MODAL 5: CÓDIGO QR OFICIAL                                 */}
          {/* ========================================================== */}
          {qrModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl max-w-sm w-full p-6 text-center border border-nude-300/40 space-y-4">
                <h3 className="font-serif text-2xl font-bold text-white">QR Oficial Sunset Vibes</h3>
                <p className="text-xs text-nude-200">Escanea con la cámara para entrar al muro, dar Match 🔥 y unirte a la fiesta.</p>
                <div className="bg-white p-4 rounded-2xl inline-block mx-auto shadow-2xl">
                  <img src={`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(window.location.href)}`} alt="QR Sunset Vibes" className="w-48 h-48" />
                </div>
                <button onClick={() => setQrModalOpen(false)} className="w-full py-3 rounded-xl nude-btn text-xs">Cerrar</button>
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* MODAL 6: COMPARTIR PUBLICACIÓN EN EL CHAT                  */}
          {/* ========================================================== */}
          {shareModalPost && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-serif text-xl font-bold text-white">Compartir Publicación</h3>
                  <button onClick={() => setShareModalPost(null)} className="text-nude-300 font-bold">✕</button>
                </div>
                <button onClick={() => handleSendPostToChat("group")} className="w-full py-3 px-4 rounded-2xl nude-btn text-xs shadow">🎉 Enviar al Chat Grupal</button>
                <button onClick={() => handleExternalShare(shareModalPost)} className="w-full py-3 px-4 rounded-2xl bg-burgundy-800 border border-nude-300/40 text-white font-bold text-xs">📲 Compartir fuera de la App</button>
                <div className="pt-2 border-t border-nude-300/20">
                  <p className="text-xs font-bold text-nude-300 mb-2">Enviar por privado a un Amigo:</p>
                  <div className="max-h-40 overflow-y-auto space-y-2 no-scrollbar">
                    {myFriendUsers.map(u => (
                      <button key={u.uid} onClick={() => handleSendPostToChat("private", u)} className="w-full p-2.5 rounded-xl bg-burgundy-950 flex items-center justify-between border border-nude-300/20">
                        <div className="flex items-center gap-2"><img src={u.avatar} alt="" className="w-7 h-7 rounded-full object-cover" /><span className="text-xs font-bold text-white">@{u.username}</span></div>
                        <span className="text-xs text-nude-300 font-bold">Enviar →</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 7: VISTA PANTALLA COMPLETA DE PUBLICACIÓN */}
          {fullscreenPost && (
            <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-md overflow-y-auto p-4 flex items-center justify-center">
              <div className="glass-card rounded-3xl max-w-md w-full overflow-hidden my-auto border border-nude-300/40">
                <div className="p-3.5 bg-burgundy-950 flex items-center justify-between border-b border-nude-300/20">
                  <button onClick={() => openUserProfile(fullscreenPost.userId)} className="flex items-center gap-2.5 text-left">
                    <img src={fullscreenPost.userAvatar} alt="" className="w-9 h-9 rounded-full object-cover" />
                    <span className="text-sm font-bold text-white hover:underline">@{fullscreenPost.userName}</span>
                  </button>
                  <button onClick={() => setFullscreenPostId(null)} className="px-3 py-1 rounded-full nude-btn text-xs">Cerrar ✕</button>
                </div>
                <div className="bg-black max-h-[55vh] flex items-center justify-center overflow-hidden">
                  <MediaRenderer item={fullscreenPost} className="w-full max-h-[55vh] object-contain" onDoubleTapLike={() => toggleLike(fullscreenPost)} />
                </div>
              </div>
            </div>
          )}

          {/* MODAL 8: EDITAR PIE DE FOTO / ADMIN EDITAR USUARIO */}
          {adminEditPost && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-serif text-xl font-bold text-white">Editar Pie de Foto</h3>
                  <button onClick={() => setAdminEditPost(null)} className="text-nude-300 font-bold">✕</button>
                </div>
                <form onSubmit={handleSavePostEdit} className="space-y-3">
                  <input type="text" value={adminEditPost.caption || ""} onChange={(e) => setAdminEditPost({ ...adminEditPost, caption: e.target.value })} className="w-full px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-xs text-white" />
                  <button type="submit" className="w-full py-3 rounded-xl nude-btn text-xs">Guardar</button>
                </form>
              </div>
            </div>
          )}

          {adminEditUser && isAdmin && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-serif text-xl font-bold text-white">Editar Invitado (Admin)</h3>
                  <button onClick={() => setAdminEditUser(null)} className="text-nude-300 font-bold">✕</button>
                </div>
                <form onSubmit={handleAdminSaveUser} className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-nude-200">Nombre de usuario</label>
                    <input type="text" value={adminEditUser.username || ""} onChange={(e) => setAdminEditUser({ ...adminEditUser, username: e.target.value })} className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-xs text-white" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-nude-200">Contraseña del invitado</label>
                    <input type="text" value={adminEditUser.password || ""} onChange={(e) => setAdminEditUser({ ...adminEditUser, password: e.target.value })} className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-xs text-white" />
                  </div>
                  <button type="submit" className="w-full py-3 rounded-xl nude-btn text-xs">Guardar Cambios</button>
                </form>
              </div>
            </div>
          )}

          {/* VISOR DE HISTORIAS PANTALLA COMPLETA */}
          {storyViewer.open && activeStoryGroup && activeStoryItem && (
            <div
              className="fixed inset-0 z-50 bg-black flex flex-col justify-between select-none"
              onTouchStart={(e) => {
                touchStartXRef.current = e.touches[0].clientX;
                wasLongPressRef.current = false;
                longPressTimerRef.current = setTimeout(() => {
                  wasLongPressRef.current = true;
                  setStoryViewer(prev => ({ ...prev, paused: true }));
                }, 200);
              }}
              onTouchEnd={(e) => {
                if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
                if (wasLongPressRef.current) {
                  setStoryViewer(prev => ({ ...prev, paused: false }));
                  return;
                }
                const endX = e.changedTouches[0].clientX;
                const diffX = endX - (touchStartXRef.current || endX);
                if (Math.abs(diffX) > 65) {
                  if (diffX < 0) goNextStory();
                  else goPrevStory();
                }
              }}
            >
              <div className="absolute top-0 left-0 right-0 z-30 p-3 bg-gradient-to-b from-black/85 via-black/40 to-transparent">
                <div className="flex gap-1.5 mb-3">
                  {activeStoryGroup.items.map((st, idx) => {
                    let widthPct = 0;
                    if (idx < storyViewer.storyIndex) widthPct = 100;
                    else if (idx === storyViewer.storyIndex) widthPct = storyViewer.progress;
                    return (
                      <div key={st.id} className="flex-1 h-1 bg-white/30 rounded-full overflow-hidden">
                        <div className="h-full bg-white transition-all duration-75" style={{ width: `${widthPct}%` }}></div>
                      </div>
                    );
                  })}
                </div>

                <div className="flex items-center justify-between">
                  <button onClick={() => openUserProfile(activeStoryGroup.userId)} className="flex items-center gap-2.5 text-left">
                    <img src={activeStoryGroup.userAvatar} alt="" className="w-9 h-9 rounded-full object-cover border border-white" />
                    <div>
                      <p className="text-sm font-extrabold text-white drop-shadow">@{activeStoryGroup.userName}</p>
                      <p className="text-[10px] text-white/80">{storyViewer.storyIndex + 1} de {activeStoryGroup.items.length}</p>
                    </div>
                  </button>

                  <div className="flex items-center gap-2" onClick={(e) => e.stopPropagation()}>
                    {(activeStoryItem.userId === currentUserDoc.uid || isAdmin) && (
                      <>
                        <button onClick={() => setStoryViewsModal(activeStoryItem.views || [])} className="px-2.5 py-1 rounded-full bg-black/70 border border-white/40 text-white text-xs font-bold">
                          👁️ {(activeStoryItem.views || []).length}
                        </button>
                        <button onClick={() => handleDeleteStory(activeStoryItem)} className="px-2.5 py-1 rounded-full bg-rose-600 text-white text-xs font-bold">🗑️</button>
                      </>
                    )}
                    <button onClick={() => setStoryViewer(prev => ({ ...prev, paused: !prev.paused }))} className="px-3 py-1 rounded-full bg-black/70 border border-white/40 text-white text-xs font-extrabold">
                      {storyViewer.paused ? "▶" : "⏸"}
                    </button>
                    <button onClick={() => setStoryViewer({ open: false, groupIndex: 0, storyIndex: 0, paused: false, progress: 0 })} className="w-8 h-8 rounded-full bg-black/70 text-white font-bold text-sm flex items-center justify-center">✕</button>
                  </div>
                </div>
              </div>

              <div className="w-full h-full flex items-center justify-center relative overflow-hidden">
                <MediaRenderer item={activeStoryItem} className="w-full h-full object-contain" autoPlay={true} controls={false} paused={isStoryEffectivelyPaused} />
                <div onClick={() => { if (!wasLongPressRef.current) goPrevStory(); }} className="absolute inset-y-20 left-0 w-1/3 z-20 cursor-pointer"></div>
                <div onClick={() => { if (!wasLongPressRef.current) goNextStory(); }} className="absolute inset-y-20 right-0 w-2/3 z-20 cursor-pointer"></div>
              </div>

              <div onClick={(e) => e.stopPropagation()} className="absolute bottom-0 left-0 right-0 z-40 p-3 bg-gradient-to-t from-black/95 via-black/75 to-transparent space-y-2.5">
                <div className="flex items-center justify-center gap-3">
                  {["🔥", "🥂", "😍", "👏"].map(emo => (
                    <button key={emo} onClick={() => handleSendStoryReply(null, activeStoryGroup, activeStoryItem, emo)} className="w-10 h-10 rounded-full bg-black/70 border border-white/30 text-xl flex items-center justify-center hover:scale-125 transition">
                      {emo}
                    </button>
                  ))}
                </div>

                <form onSubmit={(e) => handleSendStoryReply(e, activeStoryGroup, activeStoryItem)} className="flex items-center gap-2">
                  <input type="text" placeholder={`Responder a @${activeStoryGroup.userName}...`} value={storyReplyText} onFocus={() => setStoryInputFocused(true)} onBlur={() => setStoryInputFocused(false)} onChange={(e) => setStoryReplyText(e.target.value)} className="flex-1 px-4 py-2.5 rounded-full bg-black/75 border border-nude-300/50 text-xs text-white placeholder-nude-200/70 focus:outline-none" />
                  <button type="submit" className="px-4 py-2.5 rounded-full nude-btn text-xs shadow">Enviar</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL LISTA DE VISTOS EN HISTORIA O LIKES EN POST */}
          {(likesViewerList || storyViewsModal) && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card rounded-3xl max-w-sm w-full p-5 border border-nude-300/40 space-y-4 max-h-[70vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-nude-300/20 pb-3">
                  <h3 className="font-serif text-lg font-bold text-white">{likesViewerList ? "❤️ Me gusta" : "👁️ Visto por"}</h3>
                  <button onClick={() => { setLikesViewerList(null); setStoryViewsModal(null); }} className="px-3 py-1 rounded-full nude-btn text-xs">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2.5 no-scrollbar">
                  {(likesViewerList || storyViewsModal).length === 0 ? (
                    <p className="text-xs text-nude-200/70 text-center py-6">Nadie por aquí todavía.</p>
                  ) : (
                    (likesViewerList || storyViewsModal).map(uId => {
                      const uObj = users.find(u => u.uid === uId);
                      if (!uObj) return null;
                      return (
                        <div key={uId} className="flex items-center justify-between p-2.5 rounded-2xl bg-burgundy-950">
                          <button onClick={() => { setLikesViewerList(null); setStoryViewsModal(null); openUserProfile(uObj.uid); }} className="flex items-center gap-2.5 text-left">
                            <img src={uObj.avatar} alt="" className="w-9 h-9 rounded-full object-cover" />
                            <span className="text-xs font-bold text-white underline">@{uObj.username}</span>
                          </button>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}

          {/* BARRA DE NAVEGACIÓN INFERIOR */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 glass-nav max-w-lg mx-auto px-3 py-2.5 flex items-center justify-around">
            <button onClick={() => { setViewedProfileUid(null); setActiveTab("feed"); }} className={`flex flex-col items-center gap-0.5 text-[11px] font-bold ${activeTab === "feed" && !viewedProfileUser ? "text-nude-300" : "text-white/60"}`}>
              <span className="text-lg">🏠</span><span>Muro</span>
            </button>
            <button onClick={() => { setViewedProfileUid(null); setActiveTab("search"); }} className={`flex flex-col items-center gap-0.5 text-[11px] font-bold ${activeTab === "search" && !viewedProfileUser ? "text-nude-300" : "text-white/60"}`}>
              <span className="text-lg">🔍</span><span>Amigos</span>
            </button>
            <button onClick={() => { resetUploadStudio(); setUploadModal({ open: true, type: "post", withChallenge: false, isPaparazzi: false }); }} className="w-12 h-12 -mt-5 rounded-full nude-btn text-2xl shadow-2xl flex items-center justify-center border-2 border-burgundy-950">
              +
            </button>
            <button onClick={() => { setViewedProfileUid(null); setActiveTab("party"); }} className={`flex flex-col items-center gap-0.5 text-[11px] font-bold ${activeTab === "party" && !viewedProfileUser ? "text-nude-300" : "text-white/60"}`}>
              <span className="text-lg">🎉</span><span>Fiesta</span>
            </button>
            <button onClick={() => { setViewedProfileUid(null); setActiveTab("chat"); setUnreadChatCount(0); }} className={`relative flex flex-col items-center gap-0.5 text-[11px] font-bold ${activeTab === "chat" && !viewedProfileUser ? "text-nude-300" : "text-white/60"}`}>
              <span className="text-lg">💬</span><span>Chat</span>
              {unreadChatCount > 0 && <span className="absolute -top-1 right-0 w-4 h-4 rounded-full bg-emerald-500 text-[#090105] text-[9px] flex items-center justify-center font-extrabold">{unreadChatCount}</span>}
            </button>
            <button onClick={() => { setViewedProfileUid(null); setActiveTab("profile"); }} className={`relative flex flex-col items-center gap-0.5 text-[11px] font-bold ${activeTab === "profile" && !viewedProfileUser ? "text-nude-300" : "text-white/60"}`}>
              <span className="text-lg">👤</span><span>Perfil</span>
              {pendingMatchCard && <span className="absolute -top-1 right-0 w-4 h-4 rounded-full bg-amber-400 text-[#090105] text-[10px] flex items-center justify-center font-extrabold animate-ping">🔥</span>}
            </button>
            {isAdmin && (
              <button onClick={() => { setViewedProfileUid(null); setActiveTab("admin"); }} className={`flex flex-col items-center gap-0.5 text-[11px] font-extrabold ${activeTab === "admin" && !viewedProfileUser ? "text-amber-300" : "text-amber-200/70"}`}>
                <span className="text-lg">👑</span><span>Admin</span>
              </button>
            )}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SunsetVibesApp />);
  </script>
</body>
</html>
